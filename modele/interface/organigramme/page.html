<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Psychohistoire">
<meta name="theme-color" content="#FAFAF8">
<title>Psychohistoire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#FBFBFA;--surface:#FFFFFF;--soft:#F3F3F1;--ink:#1C1C1A;--muted:#62625D;--line:#E4E3DF;--line-strong:#BDBCB5;
  --accent:#2F4F8F;--accent-soft:rgba(47,79,143,.09);--var:#7A6A3A;--ok:#2E7558;--crit:#A8382B;
  --t-budget:#2F4F8F;--t-candidatures:#2E7558;--t-election:#6B4C9A;--t-apres:#9A6513;--t-dette:#A8382B;--t-variable:#7A6A3A;
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161615;--surface:#1E1E1C;--soft:#262624;--ink:#ECEBE7;--muted:#A3A29C;--line:#33332F;--line-strong:#55554F;
  --accent:#93AEEB;--accent-soft:rgba(147,174,235,.12);--var:#C9B47A;--ok:#62B693;--crit:#E07465;
  --t-budget:#93AEEB;--t-candidatures:#62B693;--t-election:#B79BE0;--t-apres:#D9A34A;--t-dette:#E07465;--t-variable:#C9B47A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--surface:#1E1E1C;--soft:#262624;--ink:#ECEBE7;--muted:#A3A29C;--line:#33332F;--line-strong:#55554F;
  --accent:#93AEEB;--accent-soft:rgba(147,174,235,.12);--var:#C9B47A;--ok:#62B693;--crit:#E07465;
  --t-budget:#93AEEB;--t-candidatures:#62B693;--t-election:#B79BE0;--t-apres:#D9A34A;--t-dette:#E07465;--t-variable:#C9B47A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--font);font-variant-numeric:tabular-nums}
.wrap{max-width:none;margin:0 auto;padding:14px 16px 12px}
h1{font-size:19px;margin:0 0 2px}
.lede{color:var(--muted);margin:0 0 6px;max-width:120ch}
.legende{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);font-size:12px;margin:0 0 10px}
.legende span{display:inline-flex;align-items:center;gap:6px}
.pastille{width:10px;height:10px;border-radius:3px;display:inline-block}
.scroll{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.cadre{position:relative}
.org{transform-origin:0 0}
.org{position:relative;margin:16px}
.org>svg{position:absolute;left:0;top:0;overflow:visible}
.n{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.pv{width:260px;border-top:5px solid var(--th);overflow:hidden}
.pv .c{padding:8px 12px 8px}
.n.pv{cursor:pointer;transition:box-shadow .15s,transform .15s}
.n.pv:hover,.n.pv:focus-visible{box-shadow:0 4px 14px rgba(0,0,0,.12);outline:none}
.pied{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;padding-top:4px;border-top:1px solid var(--line)}
.pied span{color:var(--th);font-weight:600}
dialog{border:0;border-radius:12px;padding:0;max-width:640px;width:calc(100% - 32px);max-height:86vh;overflow:auto;background:var(--surface);color:var(--ink);box-shadow:0 16px 48px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,20,18,.4)}
dialog .fermer{all:unset;cursor:pointer;position:absolute;top:12px;right:14px;font-size:24px;line-height:1;color:var(--muted);padding:2px 6px;z-index:2}
.pv.dl{width:auto;border-top:6px solid var(--th)}
.pv.dl .c{padding:16px 20px 14px}.pv.dl .titre{font-size:18px}.pv.dl .sec{padding:10px 20px 12px}
.js .obs{margin-top:2px;font-style:italic}
.js p.eq{font-size:12px;color:var(--accent);margin:2px 0 4px}
table.dec{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0}
table.dec th{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);font-weight:600;vertical-align:bottom}
table.dec th:first-child{text-align:left;text-transform:none;font-size:12px;color:var(--ink);letter-spacing:0}
table.dec td{padding:5px 6px;border-bottom:1px solid var(--line)}
table.dec td.nb{text-align:right;white-space:nowrap}
table.dec tr.tot td{font-weight:700;border-bottom:0}
table.dec tr.muted td{color:var(--muted)}
.mb{display:inline-block;width:60px;height:7px;border-radius:4px;background:var(--soft);margin-right:6px;vertical-align:middle;overflow:hidden}.mb i{display:block;height:100%;background:var(--th)}
ul.af{margin:2px 0;padding-left:18px;font-size:12.5px}ul.af li{margin:3px 0}
.fia{font-size:12px!important;margin-top:10px!important;padding:5px 9px;border-radius:6px;background:var(--soft)}
.fia-faible{color:var(--crit)}
.quand2{color:var(--muted);font-size:11.5px!important;margin:1px 0 4px!important}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:4px 0}
.oh,.or{display:grid;grid-template-columns:1fr 78px 150px 62px;gap:8px;align-items:center;font-size:12.5px}
.oh{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:3px;border-bottom:1px solid var(--line);margin-bottom:3px}
.or{padding:2px 0}.or>span:nth-child(2){color:var(--muted);text-align:right}
.b2{display:flex;align-items:center;gap:6px}.b2 i{display:block;height:7px;border-radius:4px;background:var(--th)}.b2 b{font-size:12.5px}
.dd{font-weight:700;text-align:right;color:var(--muted)}.dd.up,.dd.down{color:var(--accent)}
.va{background:var(--surface);border-top-style:dashed}
.obs1{font-size:12.5px;margin-bottom:4px}
.spark{display:block}
.le{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-top:3px}.le i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--t-variable);margin-right:4px;vertical-align:-1px}
.qv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-top:1px solid var(--line)}.qv:first-of-type{border-top:0}
.hors{all:unset;cursor:pointer;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.hl{margin:0;padding-left:16px;font-size:12.5px;columns:2;column-gap:24px}.hl li{margin:2px 0;break-inside:avoid}
.pv .quand{font-size:11.5px;color:var(--muted)}
.pv .titre{font-weight:700;font-size:14px;line-height:1.25;margin:1px 0 5px}
.pv .gros{display:flex;align-items:center;gap:10px}
.pv .gros b{font-size:21px;color:var(--th);min-width:62px}
.pv .gros .barre{flex:1;margin:0}
.barre{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft)}
.barre i{display:block;height:100%;background:var(--th)}
.pv .iss{display:grid;grid-template-columns:1fr 48px 34px minmax(0,auto);gap:2px 6px;align-items:center;font-size:12.5px}
.pv .iss b{text-align:right;color:var(--th)}
.pv .reste{font-size:11.5px;color:var(--muted);margin-top:3px}
.sec{border-top:1px solid var(--line);padding:7px 14px 9px}
.sec .h{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.sec p{margin:2px 0;font-size:12.5px;line-height:1.35}
.fact{margin:8px 0 10px}.fact .ft{font-weight:700;font-size:13px;margin-bottom:4px}.fact .ft span{font-weight:400;color:var(--muted)}
.cas{display:grid;grid-template-columns:1fr 150px 50px;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.cas .barre{position:relative;overflow:visible}.cas .barre i{border-radius:4px}
.cas .barre em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.cas b{text-align:right}
.note{color:var(--muted);font-size:11.5px!important}
.js li{grid-template-columns:12px 1fr!important;padding:8px 0!important;border-top:1px solid var(--line)}
.js li:first-child{border-top:0}
.jt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.jt b{font-size:13.5px}
.pills{display:flex;gap:6px;flex-shrink:0}.pill{font-size:12px;white-space:nowrap;padding:1px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.delta{font-weight:700;font-size:13px;white-space:nowrap;padding:1px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.delta{color:var(--accent)}
.js p{margin:3px 0 0;font-size:12.5px}
.js p.obs{font-style:italic;color:var(--muted);font-size:11.5px}
.sec p b{color:var(--ink)}
.sec .ctx{font-style:italic;color:var(--var);font-size:12px}
.js{background:var(--soft)}
.js ul{list-style:none;margin:0;padding:0}
.js li{display:grid;grid-template-columns:12px 1fr;gap:0 7px;padding:4px 0;font-size:12.5px;line-height:1.3}
.js .pt{width:9px;height:9px;border-radius:50%;margin-top:4px;border:1.5px solid var(--muted);background:var(--surface)}
.js .pt.n2{width:11px;height:11px;margin-top:3px}
.js .pt.observé{background:var(--ok);border-color:var(--ok)} .js .pt.manqué{background:var(--crit);border-color:var(--crit)}
.js small{display:block;color:var(--muted);font-size:11.5px}
.js small b{color:var(--ink);font-weight:600}
.inf{font:700 11px var(--font);fill:var(--accent)}

.etsi{position:sticky;top:0;z-index:5;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0 12px;font-size:13px;display:none}
.etsi.on{display:block}.etsi .t{font-weight:700;margin-right:8px}.etsi .f{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:999px;padding:2px 10px;margin:3px 6px 3px 0}
.etsi .f button,.etsi .raz{all:unset;cursor:pointer;color:var(--muted);font-weight:700}.etsi .raz{color:var(--accent);text-decoration:underline;margin-left:6px}
.etsi .ess{color:var(--muted);margin-left:8px}.etsi .rare{color:var(--crit);font-weight:700;margin-left:8px}
.barre{position:relative}.barre em{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);opacity:.6;z-index:1}
.tend{font-size:11.5px;font-weight:700;white-space:nowrap;margin-left:6px;color:var(--ink)}.tend small{font-weight:400;color:var(--muted);margin-left:3px;font-size:10.5px}.tend.up{color:var(--accent)}.tend.down{color:var(--ink)}.barre:has(em){overflow:visible}.pv .iss .tc .tend{margin-left:0}.barre:has(em) i{border-radius:4px}
.sec.rares{display:grid;gap:10px}.sec.rares .n.pv{position:static}
.av{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px;white-space:nowrap}.av.up{color:var(--accent)}.av.down{color:var(--crit)}
.suppose{all:unset;cursor:pointer;font-size:11.5px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-left:6px;white-space:nowrap}
.suppose.actif{background:var(--accent);color:var(--surface)}
.classe{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:6px}
table.iss2{width:100%;border-collapse:collapse;font-size:12.5px}table.iss2 td{padding:4px 6px;border-bottom:1px solid var(--line)}table.iss2 td.nb{text-align:right;white-space:nowrap}
.vues{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;margin:0 0 10px}
.vues button{all:unset;cursor:pointer;font-size:13px;padding:3px 14px;border-radius:999px;color:var(--muted)}
.vues button.on{background:var(--accent);color:var(--surface)}
.liste{display:grid;gap:10px;max-width:640px}
.liste h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--th);margin:14px 0 0;border-bottom:2px solid var(--th);padding-bottom:3px}
.liste .n.pv{position:static;width:auto}
.liste .pv .iss{grid-template-columns:1fr 90px 40px minmax(0,auto)}
.liste .spark{width:100%;height:auto}
[hidden]{display:none!important}
.tete{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 8px}
.tete h1{margin:0}
.onglets{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.onglets button{all:unset;cursor:pointer;font-size:14px;font-weight:600;padding:6px 16px;border-radius:999px;color:var(--muted)}
.onglets button.on{background:var(--ink);color:var(--surface)}
.fil{display:grid;gap:10px;max-width:640px}
.fil .n.pv{position:static;width:auto;border-top-color:var(--accent)}
.fil .jour{font-size:12px;color:var(--muted);margin:10px 0 -2px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:var(--bg);line-height:1.3}
.chip b{margin-right:4px}.chip.up b{color:var(--accent)}.chip.down b{color:var(--ink)}
.actu-resume{font-size:14.5px;line-height:1.5;margin:8px 0 0}
.sources{font-size:12.5px;color:var(--muted)}.sources a{color:var(--accent)}
.effet{font-size:13px;margin:2px 0 6px}.effet b{color:var(--accent)}
body[data-vue="liste"] .lg{display:none}
@media (max-width:720px){
  .wrap{padding:12px 12px 24px}
  h1{font-size:22px}
  .lede{font-size:14px}
  .legende{font-size:12px;gap:4px 12px}
  dialog{width:100%;max-width:none;height:100dvh;max-height:none;margin:0;border-radius:0;inset:0}
  .dlg-haut{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
  dialog .fermer{position:static;background:var(--surface);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;text-align:center;line-height:34px;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  dialog .pv.dl .c{padding-right:12px}
  .jt{flex-wrap:wrap;gap:4px 8px}
  .pills{flex-wrap:wrap}
  .quand2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .suppose{padding:6px 12px;font-size:13px;margin-left:0}
  .oh,.or{grid-template-columns:44px 1fr 52px;gap:2px 8px}
  .oh>span:first-child,.or>span:first-child{grid-column:1/-1}
  .or>span:first-child{font-weight:600;margin-top:4px}
  .oh>span:not(:first-child){display:none}
  .b2 i{max-width:calc(100% - 44px)}
  table.dec{font-size:12px}
  table.dec th,table.dec td{padding:4px 3px}
  table.iss2{font-size:12px}
  table.iss2 td{padding:4px 3px}
}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.oh,.or{grid-template-columns:minmax(0,1fr) auto 34px!important;gap:8px!important}
.oh{display:block!important}
.or .ab{color:var(--muted);white-space:nowrap;text-align:right}.or .ab b{color:var(--ink)}
.jt{flex-wrap:nowrap!important}.jt b.ell{flex:1}.jt .pp{font-weight:700;color:var(--accent);white-space:nowrap}
.pv .iss>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cap{font-size:12px;color:var(--muted);margin:0 0 4px}
#meta{margin:4px 0 8px}
@media (max-width:720px){
  .legende:not(.liens){display:none}
  .legende.liens{flex-wrap:nowrap;overflow-x:auto;font-size:13px}
  .legende.liens .hors{white-space:nowrap}
  .tete{flex-wrap:nowrap}.tete h1{font-size:19px}
  .onglets button{padding:6px 12px;font-size:13.5px}
  .oh>span:first-child,.or>span:first-child{grid-column:auto!important}
  .or>span:first-child{font-weight:400!important;margin-top:0!important}
  table.dec th:nth-child(2),table.dec td:nth-child(2){display:none}
  table.dec .mb{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="tete"><h1>Psychohistoire</h1><nav class="onglets" id="onglets"><button data-onglet="organigramme">Organigramme</button><button data-onglet="actualite">Actualité</button></nav></div>
  <div class="etsi" id="etsi"></div>
  <section id="o-actualite" hidden><div class="fil" id="fil"></div></section>
  <section id="o-organigramme">
  
  <div class="legende">
    <span><i class="pastille" style="background:var(--t-budget)"></i>budget et gouvernement</span>
    <span><i class="pastille" style="background:var(--t-candidatures)"></i>justice et candidatures</span>
    <span><i class="pastille" style="background:var(--t-election)"></i>présidentielle</span>
    <span><i class="pastille" style="background:var(--t-apres)"></i>après l'élection</span>
    <span><i class="pastille" style="background:var(--t-dette)"></i>dette et marchés</span>
    <span class="lg"><svg width="34" height="10"><line x1="1" y1="5" x2="33" y2="5" stroke="var(--accent)" stroke-width="2.6"/></svg>lien fort</span>
    <span class="lg"><svg width="34" height="10"><line x1="1" y1="5" x2="33" y2="5" stroke="var(--line-strong)" stroke-width="1.4"/></svg>lien faible</span><span><i class="pastille" style="background:var(--t-variable)"></i>variable mensuelle</span>
  </div>
  <div class="legende liens"><button class="hors" id="rares"></button><button class="hors" id="hyp"></button><button class="hors" id="hors"></button></div>
  <p class="note" id="meta"></p>
  <div class="vues" id="vues"><button data-vue="liste">liste</button><button data-vue="graphe">graphe</button></div>
  <div class="liste" id="liste" hidden></div>
  <div class="scroll" hidden><div class="cadre" id="cadre"><div class="org" id="org"></div></div></div>
  </section>
  <dialog id="dlg"><div class="dlg-haut"><button class="fermer" id="x" aria-label="Fermer">×</button></div><div id="dc"></div></dialog>
</div>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script>window.__DONNEES__=/*__DONNEES__*/null;</script>
<script src="ORGJS"></script>
</body>
</html>
