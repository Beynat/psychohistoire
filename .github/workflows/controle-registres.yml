name: Contrôle des registres

# Protocole, sections 0, 8.8 et 12. Logique dans scripts/controle_registres.py (testée par scripts/tests.py).
# Contrôle tous les commits de main depuis le dernier repère du journal des contrôles. Le journal vit sur la
# branche « controles » (fichier controles.jsonl), écrite par ce seul workflow : il y inscrit l'empreinte de chaque
# ligne de registre poussée hors fenêtre, sans fuseau, avec un autre décalage que celui de Paris ou illisible
# (ce qui l'écarte de toute lecture des registres), puis un repère « controle_jusqua ». Une poussée directe sur la
# branche « controles » déclenche ce workflow, et seulement elle (les écritures du workflow ne le déclenchent pas) :
# elle est signalée en échec. Le contrôle est détectif : un échec est public.

on:
  push:
    branches: [main, controles]
  workflow_dispatch: {}

concurrency:
  group: controle-registres
  cancel-in-progress: false

permissions:
  contents: write   # écriture de la branche « controles »

jobs:
  ajout-seul:
    runs-on: ubuntu-latest
    steps:
      - name: Poussée directe sur la branche du journal
        if: github.ref == 'refs/heads/controles'
        run: |
          echo "::error::La branche « controles » a été modifiée par une poussée ($GITHUB_SHA), et non par le workflow."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Journal des contrôles et activité du dépôt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git ls-remote --exit-code origin controles > /dev/null
          code=$?
          set -e
          attendue=$(cat modele/controles_racine.txt 2>/dev/null || true)
          if [ "$code" = "0" ]; then
            git fetch -q origin +controles:refs/remotes/origin/controles
            racine=$(git rev-list --max-parents=0 origin/controles)
            if [ -n "$attendue" ] && ! echo "$racine" | grep -qx "$attendue"; then
              echo "::error::Branche « controles » recréée (racine $racine, attendue $attendue)"; exit 1
            fi
            git show origin/controles:controles.jsonl > "$RUNNER_TEMP/journal.jsonl"
          elif [ "$code" = "2" ] && [ -z "$attendue" ]; then
            : > "$RUNNER_TEMP/journal.jsonl"
          else
            echo "::error::Branche « controles » absente ou inaccessible"; exit 1
          fi
          # Heure de chaque poussée sur main (une plage recontrôlée est jugée poussée par poussée).
          gh api "repos/${GITHUB_REPOSITORY}/activity?ref=refs/heads/main&activity_type=push&per_page=100" \
            --jq '[.[] | {before, after, timestamp}]' > "$RUNNER_TEMP/pousses.json" || echo "[]" > "$RUNNER_TEMP/pousses.json"
          echo "Activité : $(jq length "$RUNNER_TEMP/pousses.json") poussées ; journal : $(wc -l < "$RUNNER_TEMP/journal.jsonl") entrées"
          echo "JOURNAL_CONTROLES=$RUNNER_TEMP/journal.jsonl" >> "$GITHUB_ENV"
          echo "JOURNAL_NOUVEAU=$RUNNER_TEMP/nouveau.jsonl" >> "$GITHUB_ENV"
          echo "POUSSES=$RUNNER_TEMP/pousses.json" >> "$GITHUB_ENV"
      - name: Ajout seul, horodatage, lignes à inscrire
        env:
          AVANT: ${{ github.event.before }}
          POUSSE_LE: ${{ github.event.repository.pushed_at }}
        run: python3 scripts/controle_registres.py
      - name: Inscription au journal des contrôles
        # Toute exécution déclenchée par une poussée sur main, relances comprises (écriture idempotente), même si le
        # contrôle a relevé des anomalies ; jamais un déclenchement manuel.
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -s "$JOURNAL_NOUVEAU" || { echo "::error::Contrôle interrompu : rien à inscrire, la plage sera recontrôlée"; exit 1; }
          git config user.name "controle-psychohistoire"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3; do
            rm -rf "$RUNNER_TEMP/j"; git worktree prune
            if git fetch -q origin +controles:refs/remotes/origin/controles 2>/dev/null; then
              git worktree add -q -B controles "$RUNNER_TEMP/j" origin/controles
            else
              git worktree add -q --detach "$RUNNER_TEMP/j"
              git -C "$RUNNER_TEMP/j" checkout -q --orphan controles
              git -C "$RUNNER_TEMP/j" rm -rqf .
            fi
            python3 scripts/controle_registres.py --inscrire "$RUNNER_TEMP/j/controles.jsonl"
            git -C "$RUNNER_TEMP/j" add controles.jsonl
            git -C "$RUNNER_TEMP/j" commit -q -m "Contrôle de $GITHUB_SHA (exécution $GITHUB_RUN_ID, tentative $GITHUB_RUN_ATTEMPT)"
            if git -C "$RUNNER_TEMP/j" push -q origin controles; then exit 0; fi
            sleep 5
          done
          echo "::error::Inscription au journal des contrôles impossible après trois essais"; exit 1
      - name: Banque d'événements figée après le premier gel, ajouts plafonnés (noyau, sections 8.8 et 12)
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/controle_banque.py
