name: Contrôle des registres

# Protocole, sections 0, 8.8 et 12. Logique dans scripts/controle_registres.py (testée par scripts/tests.py).
# Contrôle tous les commits depuis le dernier commit contrôlé (historique des exécutions de ce workflow), y compris
# ceux qu'une poussée n'a pas fait contrôler. Les lignes de registre poussées hors fenêtre, sans fuseau ou avec un
# autre décalage que celui de Paris sont inscrites au journal des contrôles (registre/controles.jsonl), ce qui les
# annule pour la notation. Le contrôle est détectif : un échec est public.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: controle-registres
  cancel-in-progress: false

permissions:
  contents: write   # inscription au journal des contrôles
  actions: read     # dernier commit contrôlé

jobs:
  ajout-seul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dernier commit contrôlé
        env:
          GH_TOKEN: ${{ github.token }}
          AVANT: ${{ github.event.before }}
        run: |
          # Exécution terminée (réussie ou en échec, pas annulée) la plus récente d'une poussée, hors celle-ci.
          base=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/controle-registres.yml/runs?event=push&status=completed&per_page=30" \
                 --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and (.conclusion == \"success\" or .conclusion == \"failure\"))][0].head_sha // empty" || true)
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" HEAD; then
            echo "::warning::Dernier commit contrôlé introuvable : contrôle depuis github.event.before."
            base="$AVANT"
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
      - name: Ajout seul, horodatage, journal des contrôles
        env:
          POUSSE_LE: ${{ github.event.repository.pushed_at }}
          ECRIRE_JOURNAL: ${{ github.event_name == 'push' && github.run_attempt == '1' && '1' || '0' }}
        run: python3 scripts/controle_registres.py
      - name: Inscription au journal des contrôles
        if: always() && github.event_name == 'push' && github.run_attempt == '1'
        run: |
          if [ -n "$(git status --porcelain registre/controles.jsonl)" ]; then
            if git diff --unified=0 HEAD -- registre/controles.jsonl | grep -q '^-[^-]'; then
              echo "::error::registre/controles.jsonl modifié autrement que par ajout"; exit 1
            fi
            git config user.name "controle-psychohistoire"
            git config user.email "actions@users.noreply.github.com"
            git add registre/controles.jsonl
            git commit -q -m "Journal des contrôles : lignes poussées hors fenêtre (exécution $GITHUB_RUN_ID)"
            for i in 1 2 3; do
              git fetch -q origin main
              if git rebase -q origin/main && git push -q origin HEAD:main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            echo "::error::Inscription au journal des contrôles impossible après trois essais"; exit 1
          fi
      - name: Banque d'événements figée après le premier gel, ajouts plafonnés (noyau, sections 8.8 et 12)
        run: python3 scripts/controle_banque.py
