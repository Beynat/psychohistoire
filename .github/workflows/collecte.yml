name: Collecte quotidienne

on:
  schedule:
    - cron: "17 4 * * *"   # chaque nuit, 4 h 17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Interroger les sources ouvertes
        run: python collecte/collect.py
      - name: Enregistrer les données si elles ont changé
        run: |
          git config user.name "collecte-psychohistoire"
          git config user.email "actions@users.noreply.github.com"
          git add data/collecte.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Collecte du $(date -u +%Y-%m-%d)"
            git push
          fi
