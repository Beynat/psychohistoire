name: Collecte quotidienne

on:
  schedule:
    - cron: "17 4 * * *"   # chaque nuit, 4 h 17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Interroger les sources ouvertes
        run: python collecte/collect.py
      - name: Relever les cotes des marchés de prédiction
        run: python collecte/cotes.py
        continue-on-error: true
      - name: Mettre à jour les historiques longs
        run: python collecte/historique.py
        continue-on-error: true
      - name: Séries quotidiennes Banque de France (Webstat)
        run: python collecte/webstat.py
        env:
          WEBSTAT_KEY: ${{ secrets.WEBSTAT_KEY }}
        continue-on-error: true
      - name: Journal des premières valeurs collectées (noyau, section 8.8)
        run: |
          python scripts/premieres_valeurs.py
          # Une poussée faite par ce workflow ne déclenche pas le contrôle des registres : on vérifie ici
          # que le journal n'est modifié que par ajout (relecture 14, N4).
          if git diff --unified=0 HEAD -- data/premieres_valeurs.jsonl | grep -q '^-[^-]'; then
            echo "::error::data/premieres_valeurs.jsonl modifié autrement que par ajout"; exit 1
          fi
      - name: Données de l'interface et de la carte (reseau.html)
        run: |
          python scripts/interface.py
          python scripts/carte.py
        continue-on-error: true
      - name: Enregistrer les données si elles ont changé
        run: |
          git config user.name "collecte-psychohistoire"
          git config user.email "actions@users.noreply.github.com"
          git add data/collecte.json data/veille.json data/cotes.json data/historique data/premieres_valeurs.jsonl data/interface_v1.json data/carte_v0.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Collecte du $(date -u +%Y-%m-%d)"
            git push
          fi
