name: Version du protocole

# Crée automatiquement le tag et la release de chaque nouvelle version du noyau
# (modele/protocole.md, tag protocole-vX.Y) et de l'annexe phase 3
# (modele/annexe_phase3.md, tag annexe-phase3-vX.Y). Le numéro est lu sur la première
# ligne. Si un texte change sans changement de numéro, le contrôle échoue : toute
# modification doit créer une version (noyau, section 12).

on:
  push:
    branches: [main]
    paths: [modele/protocole.md, modele/annexe_phase3.md]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Créer les tags et releases, ou vérifier qu'ils sont à jour
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --quiet
          echec=0
          for paire in "modele/protocole.md:protocole:Protocole" "modele/annexe_phase3.md:annexe-phase3:Annexe phase 3"; do
            f=${paire%%:*}; reste=${paire#*:}; prefixe=${reste%%:*}; titre=${reste#*:}
            [ -f "$f" ] || continue
            v=$(head -1 "$f" | sed -nE 's/.*version ([0-9]+(\.[0-9]+)*).*/\1/p')
            if [ -z "$v" ]; then echo "::error file=$f::Numéro de version introuvable en première ligne"; echec=1; continue; fi
            tag="$prefixe-v$v"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              if git diff --quiet "$tag" HEAD -- "$f"; then
                echo "$tag déjà posé, texte inchangé."
              else
                echo "::error file=$f::Le texte a changé depuis $tag sans nouveau numéro de version."
                echec=1
              fi
            else
              statut=$(sed -n '3p' "$f")
              notes=$(printf '%s\n\nTag posé automatiquement au premier commit de cette version sur main (%s). Il fait foi pour l antériorité. Changements : modele/journal.md.' "$statut" "$GITHUB_SHA")
              gh release create "$tag" --target "$GITHUB_SHA" --title "$titre v$v" --notes "$notes"
              echo "Release $tag créée sur $GITHUB_SHA."
            fi
          done
          exit $echec
