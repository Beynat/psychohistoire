<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Psychohistoire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : en-tête + barre d'onglets collante, une vue à la fois, colonne de lecture de 1080px max */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#16202B; --muted:#5B6673; --line:#D5DBE2;
  --accent:#2B4C9B; --accent-soft:rgba(43,76,155,.10);
  --ok:#2F7D63; --warn:#A86E14; --crit:#B23A2E; --ok-soft:rgba(47,125,99,.12); --warn-soft:rgba(168,110,20,.14); --crit-soft:rgba(178,58,46,.12);
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#17202A; --surface-2:#1C2733; --ink:#E6EBF0; --muted:#97A3B0; --line:#2C3846;
  --accent:#8EA9EE; --accent-soft:rgba(142,169,238,.14);
  --ok:#5DBB98; --warn:#E0A846; --crit:#E8705F; --ok-soft:rgba(93,187,152,.14); --warn-soft:rgba(224,168,70,.15); --crit-soft:rgba(232,112,95,.15);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#17202A; --surface-2:#1C2733; --ink:#E6EBF0; --muted:#97A3B0; --line:#2C3846;
  --accent:#8EA9EE; --accent-soft:rgba(142,169,238,.14);
  --ok:#5DBB98; --warn:#E0A846; --crit:#E8705F; --ok-soft:rgba(93,187,152,.14); --warn-soft:rgba(224,168,70,.15); --crit-soft:rgba(232,112,95,.15);
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
header.top{padding-block:22px 10px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand h1{font:600 26px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:13px}
.brand .sub b{font-family:var(--f-data);font-weight:500;color:var(--ink)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .scroll{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:6px}
.tabs .scroll::-webkit-scrollbar{display:none}
.tabs .grp{display:flex;align-items:center;gap:2px;padding-left:10px;margin-left:6px;border-left:1px solid var(--line)}
.tabs .grp:first-child{border-left:0;margin-left:0;padding-left:0}
.tabs .glabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px;white-space:nowrap}
.tabs button{all:unset;cursor:pointer;white-space:nowrap;padding:7px 10px;border-radius:6px;font-size:14px;color:var(--muted)}
.tabs button:hover{color:var(--ink);background:var(--surface-2)}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 -2px 0 var(--accent);font-weight:600}
main{padding-block:22px 48px}
.view-h{display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.view-h h2{font:600 22px/1.2 var(--f-display);margin:0;text-wrap:balance}
.view-h p{margin:0;color:var(--muted);max-width:68ch}
.crumb{font-size:13px;color:var(--muted)}
.crumb a{text-decoration:none}
h3{font:600 17px/1.3 var(--f-display);margin:0}
h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0;font-weight:600}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.link{cursor:pointer;transition:border-color .15s}
.card.link:hover{border-color:var(--accent)}
.section{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.section:first-child{margin-top:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.big{font:500 30px/1 var(--f-data);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.between{justify-content:space-between}
.ref{all:unset;cursor:pointer;color:var(--accent);font-weight:500;border-bottom:1px solid var(--accent-soft)}
.ref:hover{border-bottom-color:var(--accent)}
/* jauge 0-10 */
.gauge{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--ok-soft) 0 35%,var(--warn-soft) 35% 65%,var(--crit-soft) 65% 100%)}
.gauge i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.gauge-scale{display:flex;justify-content:space-between;font:11px var(--f-data);color:var(--muted)}
/* barres de probabilité */
.hyp{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;align-items:center}
.hyp + .hyp{margin-top:8px}
.hyp .lab{font-size:14px;min-width:0}
.hyp .lab small{display:block;color:var(--muted);font-size:12px}
.hyp .pct{font:500 15px var(--f-data);text-align:right}
.bar{grid-column:1 / -1;position:relative;height:8px;background:var(--surface-2);border-radius:4px}
.bar b{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.bar .rng{position:absolute;top:-3px;height:14px;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);opacity:.45}
.bar .ext{position:absolute;top:-5px;width:2px;height:18px;background:var(--warn)}
.dom b{background:var(--accent)} .hyp:not(.dom) .bar b{opacity:.45}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.list{display:flex;flex-direction:column}
.list > *{padding:11px 0;border-bottom:1px solid var(--line)}
.list > *:last-child{border-bottom:0}
.si-pos{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ok-soft) 0 35%,var(--warn-soft) 35% 65%,var(--crit-soft) 65% 100%);min-width:90px}
.si-pos i{position:absolute;top:-3px;width:3px;height:12px;background:var(--ink);border-radius:2px;transform:translateX(-1.5px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;font-size:12.5px;padding:3px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.svgwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.svgwrap svg{display:block;min-width:700px;width:100%;height:auto}
.chart svg{display:block;width:100%;height:auto}
.timeline .ev{display:grid;grid-template-columns:92px minmax(0,1fr);gap:4px 14px}
.timeline time{font:500 13px var(--f-data);color:var(--muted);padding-top:2px}
.note{background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted);font-size:14px}
dl.dict{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:0;margin:0}
dl.dict dt,dl.dict dd{padding:9px 0;border-bottom:1px solid var(--line);margin:0}
dl.dict dt{font-weight:600;padding-right:14px}
footer{color:var(--muted);font-size:12.5px;padding-block:0 32px}
.mobile-hint{display:none}
@media (max-width:720px){.mobile-hint{display:block}}
@media (max-width:560px){
  .brand h1{font-size:22px}
  dl.dict{grid-template-columns:1fr} dl.dict dt{border-bottom:0;padding-bottom:0}
  .timeline .ev{grid-template-columns:1fr}
  .big{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top wrap">
  <div class="brand">
    <h1>Psychohistoire</h1>
    <span class="sub" id="releve">Chargement du relevé…</span>
  </div>
</header>
<nav class="tabs" aria-label="Onglets">
  <div class="wrap"><div class="scroll" id="tabs"></div></div>
</nav>
<main class="wrap" id="view" tabindex="-1"></main>
<footer class="wrap">Projet théorique et récréatif inspiré d'Asimov. Les probabilités sont produites par des agents IA selon une méthode publiée dans l'onglet Méthodologie ; elles ne constituent aucun conseil.</footer>

<script>
const TABS=[
  ["Lire",[["synthese","Synthèse"],["cartographie","Cartographie"],["indicateurs","Indicateurs"],["sous-indicateurs","Sous-indicateurs"]]],
  ["Suivre",[["pivots","Pivots"],["actualite","Actualité"],["previsions","Prévisions"]]],
  ["Appliquer",[["quotidien","Quotidien"]]],
  ["Référence",[["precedents","Précédents"],["methodologie","Méthodologie"]]]
];
let D=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fr=(n,d=1)=>Number(n).toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d});
const dfr=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d)).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"})};
const median=a=>{const s=[...a].sort((x,y)=>x-y);return s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2};
function to100(vals){const t=vals.reduce((a,b)=>a+b,0);const raw=vals.map(v=>v*100/t);const fl=raw.map(Math.floor);let rest=100-fl.reduce((a,b)=>a+b,0);raw.map((v,i)=>[v-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(rest>0){fl[i]++;rest--}});return fl}

/* --- calculs --- */
function score(si){const [t0,t1,t2,tm]=si.seuils,v=si.valeur;const pts=[[t0,0],[t1,3.5],[t2,6.5],[tm,10]];if(v<=t0)return 0;if(v>=tm)return 10;for(let i=1;i<pts.length;i++){if(v<=pts[i][0]){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];return y0+(y1-y0)*(v-x0)/(x1-x0)}}return 10}
const etat=s=>s<3.5?["ok","Stable"]:s<6.5?["warn","Sous tension"]:["crit","Critique"];
function marge(si){const [,t1,t2]=si.seuils,v=si.valeur;const u=si.unite.startsWith("rang")?"cran":si.unite;const f=x=>si.unite==="pb"?fr(x,0):fr(x,1);
  if(si.id==="SI-01-06"){if(v<t1)return `${fr(t1-v,1)} rang avant tension`;if(v<t2)return `${fr(t2-v,1)} rang avant critique`;return "seuil critique dépassé"}
  if(v<t1)return `${f(t1-v)} ${u} avant tension`;if(v<t2)return `${f(t2-v)} ${u} avant critique`;return `seuil critique dépassé de ${f(v-t2)} ${u}`}
const siById=id=>D.sousIndicateurs.find(s=>s.id===id);
function noteInd(ind){const sc=ind.sous.map(id=>score(siById(id)));return sc.reduce((a,b)=>a+b,0)/sc.length}
function hypsMedian(hs,key="estimations"){const m=hs.map(h=>median(h[key]));return to100(m)}
function questionDist(q){
  if(!q.conditionnelle){return hypsMedian(q.hypotheses)}
  const piv=D.pivots.find(p=>p.id===q.conditionnelle);const bq=piv.questions[0];const bp=hypsMedian(bq.hypotheses);const pB1=bp[0]/100;
  const c1=to100(q.hypotheses.map(h=>median(h.si.B1))),c2=to100(q.hypotheses.map(h=>median(h.si.nonB1)));
  return {glob:to100(q.hypotheses.map((h,i)=>pB1*c1[i]+(1-pB1)*c2[i])),c1,c2,pB1:bp[0]};
}
const trend=t=>t==="hausse"?'<span title="en dégradation" aria-label="en dégradation">▲</span>':t==="baisse"?'<span aria-label="en amélioration">▼</span>':'<span aria-label="stable">▬</span>';

/* --- navigation --- */
function buildTabs(){$("#tabs").innerHTML=TABS.map(([g,items])=>`<div class="grp"><span class="glabel">${g}</span>${items.map(([id,l])=>`<button data-go="${id}">${l}</button>`).join("")}</div>`).join("")}
function go(h){if(location.hash.slice(1)===h){render()}else{location.hash=h}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-go]");if(t){e.preventDefault();go(t.dataset.go)}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".card.link")){e.preventDefault();go(e.target.dataset.go)}});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
const link=(id,label)=>`<button class="ref" data-go="${refRoute(id)}">${esc(label||refLabel(id))}</button>`;
function refRoute(id){if(id.startsWith("PV"))return "pivot-"+id;if(id.startsWith("IS"))return "ind-"+id;if(id.startsWith("SI"))return "ind-"+siById(id).ind;if(id.startsWith("EV"))return "actualite";if(id.startsWith("P-"))return "previsions";return "synthese"}
function refLabel(id){if(id.startsWith("PV"))return D.pivots.find(p=>p.id===id).nom;if(id.startsWith("IS"))return D.indicateurs.find(p=>p.id===id).nom;if(id.startsWith("SI"))return siById(id).court;return id}

function render(){
  const h=location.hash.slice(1)||"synthese";
  const base=h.startsWith("pivot-")?"pivots":h.startsWith("ind-")?"indicateurs":h;
  document.querySelectorAll("#tabs [data-go]").forEach(b=>{if(b.dataset.go===base)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const V={synthese,cartographie,indicateurs,"sous-indicateurs":sousInd,pivots,actualite,previsions,quotidien,precedents,methodologie};
  let html;
  if(h.startsWith("pivot-"))html=pivotPage(h.slice(6));
  else if(h.startsWith("ind-"))html=indPage(h.slice(4));
  else html=(V[h]||synthese)();
  $("#view").innerHTML=html;
  const a=document.querySelector('#tabs [aria-current="page"]');if(a)a.scrollIntoView({block:"nearest",inline:"nearest"});
}

/* --- composants --- */
function gauge(n){return `<div class="gauge" role="img" aria-label="Note ${fr(n)} sur 10"><i style="left:${n*10}%"></i></div><div class="gauge-scale"><span>0 stable</span><span>3,5</span><span>6,5</span><span>10 critique</span></div>`}
function hypBars(hs,dist,{ranges=null,ext=null}={}){const max=Math.max(...dist);return hs.map((h,i)=>{
  const r=ranges?ranges[i]:null;const e=ext?ext[i]:null;
  return `<div class="hyp ${dist[i]===max?"dom":""}"><div class="lab">${esc(h.nom)}${h.detail?`<small>${esc(h.detail)}</small>`:""}</div><div class="pct">${dist[i]} %</div>
  <div class="bar"><b style="width:${dist[i]}%"></b>${r?`<span class="rng" style="left:${Math.min(...r)}%;width:${Math.max(...r)-Math.min(...r)}%" title="estimations ${Math.min(...r)} à ${Math.max(...r)} %"></span>`:""}${e!=null?`<span class="ext" style="left:${e}%" title="référence externe ${e} %"></span>`:""}</div></div>`}).join("")}
function indCard(ind){const n=noteInd(ind);const [c,l]=etat(n);return `<div class="card link" tabindex="0" role="link" data-go="ind-${ind.id}">
  <div class="row between"><h3>${esc(ind.nom)}</h3><span class="pill ${c}">${l}</span></div>
  <div class="row"><span class="big">${fr(n)}</span><span class="muted small">/ 10 ${trend(ind.tendance)} · marge ${fr(6.5-n)} avant critique</span></div>
  ${gauge(n)}<p class="small muted" style="margin:0">${esc(ind.lecture)}</p></div>`}
function pivotDominant(p){const q=p.questions[0];const d=q.conditionnelle?questionDist(q).glob:hypsMedian(q.hypotheses);const i=d.indexOf(Math.max(...d));return [q.hypotheses[i].nom,d[i],q]}
function pivotCard(p){const [nom,pct,q]=pivotDominant(p);return `<div class="card link" tabindex="0" role="link" data-go="pivot-${p.id}">
  <div class="row between"><h3>${esc(p.nom)}</h3><span class="pill ${p.type==="sous-pivot"?"neutral":"acc"}">${p.type==="sous-pivot"?"Sous-pivot":"Pivot"}</span></div>
  <p class="small muted" style="margin:0">${esc(q.texte)}</p>
  <div class="row"><span class="big">${pct} %</span><span class="small">${esc(nom)}${q.conditionnelle?' <span class="muted">· calculé</span>':""}</span></div>
  <div class="small muted">Échéance ${dfr(p.echeance)}${p.aval.length?` · alimente ${p.aval.map(a=>refLabel(a)).join(", ")}`:""}${p.amont.length?` · dépend de ${p.amont.map(a=>refLabel(a)).join(", ")}`:""}</div></div>`}

function forecasts(){
  const out=[];
  D.pivots.forEach(p=>p.questions.forEach(q=>{const d=q.conditionnelle?questionDist(q).glob:hypsMedian(q.hypotheses);
    const ech=q.id==="Q-PV02-B"?"2027-04-18":p.echeance;
    out.push({id:q.id,piv:p.id,texte:q.texte,dist:q.hypotheses.map((h,i)=>[h.nom,d[i]]),echeance:ech,resolution:q.resolution,calc:!!q.conditionnelle,ext:q.hypotheses.some(h=>h.externe!=null)?q.hypotheses.map(h=>h.externe):null,extSrc:q.externeSource})}));
  D.previsionsSimples.forEach(p=>{const m=median(p.estimations);out.push({id:p.id,ind:p.ind,texte:p.texte,dist:[["Oui",m],["Non",100-m]],echeance:p.echeance,resolution:p.resolution})});
  return out.sort((a,b)=>a.echeance.localeCompare(b.echeance));
}

/* --- vues --- */
function synthese(){
  const ind=D.indicateurs[0];
  const alerts=D.sousIndicateurs.map(s=>({s,sc:score(s)})).filter(x=>x.sc>=6.5||(x.sc>=5.8)).sort((a,b)=>b.sc-a.sc);
  const fc=forecasts();
  return `<div class="view-h"><h2>Les finances publiques sont à 0,4 point du seuil critique, à six mois de la présidentielle</h2>
  <p>L'écart de taux avec l'Allemagne a franchi son seuil critique et le budget 2027 a plus de chances de finir en loi spéciale ou en censure qu'adopté. Dans 44 % des cas calculés, le RN remporte la présidentielle.</p></div>
  <div class="grid g2">
    <div class="section"><h4>Indicateurs structurels</h4>${indCard(ind)}<p class="small muted" style="margin:0">1 indicateur construit sur 8 visés ; les autres seront définis en phase Listes.</p></div>
    <div class="section"><h4>Moments pivots</h4>${D.pivots.slice().reverse().map(pivotCard).join("")}</div>
  </div>
  <div class="grid g2" style="margin-top:22px">
    <div class="section"><h4>Prochaines échéances</h4><div class="card"><div class="list">${fc.map(f=>{const top=f.dist.reduce((a,b)=>b[1]>a[1]?b:a);return `<div class="row between"><div style="min-width:0;flex:1 1 220px"><div class="small muted num">${dfr(f.echeance)}</div><div>${esc(f.texte)}</div></div><span class="pill neutral">${esc(top[0])} ${top[1]} %</span></div>`}).join("")}</div></div></div>
    <div class="section"><h4>Alertes</h4><div class="card"><div class="list">${alerts.map(({s,sc})=>{const [c,l]=etat(sc);return `<div class="row between"><div style="min-width:0;flex:1 1 220px">${link(s.id,s.nom)}<div class="small muted">${esc(s.affiche)} · ${esc(marge(s))}</div></div><span class="pill ${c}">${l}</span></div>`}).join("")}</div></div>
    <div class="card"><div class="row between"><h3>Calibration</h3><span class="pill neutral">0 / ${fc.length} résolues</span></div><p class="small muted" style="margin:0">Le score de Brier s'affichera dès la première prévision résolue (Moody's, 31 octobre), comparé aux lignes de base « statu quo » et « 50 % partout ». La courbe de calibration apparaîtra à partir de 20 prévisions résolues.</p></div></div>
  </div>`;
}

function cartographie(){
  const bud=D.pivots.find(p=>p.id==="PV-01"),pre=D.pivots.find(p=>p.id==="PV-02");
  const bq=bud.questions[0],bd=hypsMedian(bq.hypotheses);const pB1=bd[0],pNo=100-pB1;
  const q=pre.questions[0],{glob,c1,c2}=questionDist(q);
  const ind=D.indicateurs[0],n=noteInd(ind);
  const joint=q.hypotheses.map((h,i)=>[pB1*c1[i]/100,pNo*c2[i]/100]);
  let best=[0,0,0];joint.forEach((j,i)=>j.forEach((v,k)=>{if(v>best[0])best=[v,i,k]}));
  const W=n=>Math.max(1.2,n/3.2);
  const X0=24,X1=232,X2=520,BW=170,WW=200,NH=64;
  const yB=[120,300],yW=[66,162,258,354];
  const tx=(x,y,t,o="")=>`<text x="${x}" y="${y}" ${o}>${t}</text>`;
  let s=`<svg viewBox="0 0 760 486" role="img" aria-label="Carte des scénarios France : le budget 2027 conditionne la présidentielle 2027" font-family="Public Sans, system-ui, sans-serif">`;
  s+=tx(X0,26,"Aujourd'hui",'font-size="12" fill="var(--muted)"')+tx(X1,26,"Sous-pivot · Budget 2027 (31/12/2026)",'font-size="12" fill="var(--muted)"')+tx(X2,26,"Pivot · Présidentielle 2027 (02/05/2027)",'font-size="12" fill="var(--muted)"');
  const yT=210;
  [pB1,pNo].forEach((p,k)=>{const crit=k===best[2];s+=`<path d="M${X0+140} ${yT} C ${X0+180} ${yT}, ${X1-40} ${yB[k]}, ${X1} ${yB[k]}" fill="none" stroke="${crit?"var(--accent)":"var(--line)"}" stroke-width="${W(p)}" stroke-linecap="round"/>`});
  joint.forEach((j,i)=>j.forEach((v,k)=>{const crit=i===best[1]&&k===best[2];s+=`<path d="M${X1+BW} ${yB[k]} C ${X1+BW+60} ${yB[k]}, ${X2-60} ${yW[i]}, ${X2} ${yW[i]}" fill="none" stroke="${crit?"var(--accent)":"var(--line)"}" stroke-width="${W(v)}" stroke-linecap="round" opacity="${crit?1:.9}"/>`}));
  s+=`<rect x="${X0}" y="${yT-32}" width="140" height="64" rx="8" fill="var(--surface-2)" stroke="var(--line)"/>`+tx(X0+70,yT-6,"3 octobre 2026",'text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)"')+tx(X0+70,yT+14,"état actuel",'text-anchor="middle" font-size="12" fill="var(--muted)"');
  [["Budget adopté",pB1,"loi de finances ou ordonnance"],["Budget non adopté",pNo,`dont censure ${bd[1]} %, loi spéciale ${bd[2]} %`]].forEach(([l,p,sub],k)=>{const crit=k===best[2];
    s+=`<g class="node" data-go="pivot-PV-01" style="cursor:pointer"><rect x="${X1}" y="${yB[k]-NH/2}" width="${BW}" height="${NH}" rx="8" fill="${crit?"var(--accent-soft)":"var(--surface)"}" stroke="${crit?"var(--accent)":"var(--line)"}" stroke-width="${crit?2:1}"/>`+tx(X1+12,yB[k]-10,l,'font-size="13" font-weight="600" fill="var(--ink)"')+tx(X1+BW-12,yB[k]-10,p+" %",'text-anchor="end" font-size="14" font-family="IBM Plex Mono, monospace" fill="var(--ink)"')+tx(X1+12,yB[k]+14,sub,'font-size="11" fill="var(--muted)"')+`</g>`});
  q.hypotheses.forEach((h,i)=>{const crit=i===best[1];
    s+=`<g data-go="pivot-PV-02" style="cursor:pointer"><rect x="${X2}" y="${yW[i]-38}" width="${WW+20}" height="76" rx="8" fill="${crit?"var(--accent-soft)":"var(--surface)"}" stroke="${crit?"var(--accent)":"var(--line)"}" stroke-width="${crit?2:1}"/>`+tx(X2+12,yW[i]-14,h.nom,'font-size="13" font-weight="600" fill="var(--ink)"')+tx(X2+WW+8,yW[i]-14,glob[i]+" %",'text-anchor="end" font-size="15" font-family="IBM Plex Mono, monospace" fill="var(--ink)"')+tx(X2+12,yW[i]+6,`si adopté ${c1[i]} % · sinon ${c2[i]} %`,'font-size="11" fill="var(--muted)"')+tx(X2+12,yW[i]+24,`dont ${fr(joint[i][1],1)} pts via « non adopté »`,'font-size="11" fill="var(--muted)"')+`</g>`});
  const [c,l]=etat(n);
  s+=`<line x1="${X1+BW/2}" y1="${yB[1]+NH/2}" x2="${X1+BW/2}" y2="408" stroke="var(--line)" stroke-dasharray="3 3"/>`;
  s+=`<g data-go="ind-IS-01" style="cursor:pointer"><rect x="${X1}" y="408" width="${BW}" height="54" rx="8" fill="var(--surface)" stroke="var(--line)"/>`+tx(X1+12,430,"Finances publiques",'font-size="12.5" font-weight="600" fill="var(--ink)"')+tx(X1+12,450,`${fr(n)} / 10 · marge ${fr(6.5-n)}`,`font-size="11.5" fill="var(--${c})"`)+`</g>`;
  s+=`<line x1="${X2+(WW+20)/2}" y1="${yW[3]+38}" x2="${X2+(WW+20)/2}" y2="408" stroke="var(--line)" stroke-dasharray="3 3"/>`;
  s+=`<rect x="${X2}" y="408" width="${WW+20}" height="54" rx="8" fill="none" stroke="var(--line)" stroke-dasharray="4 3"/>`+tx(X2+12,430,"Stabilité institutionnelle",'font-size="12.5" font-weight="600" fill="var(--muted)"')+tx(X2+12,450,"à construire en phase Listes",'font-size="11.5" fill="var(--muted)"');
  s+=`</svg>`;
  const scen=q.hypotheses.map((h,i)=>({nom:h.nom,p:glob[i],v1:joint[i][0],v2:joint[i][1],i})).sort((a,b)=>b.p-a.p);
  return `<div class="view-h"><h2>Le chemin le plus probable passe par un budget non adopté puis une victoire du RN</h2>
  <p>Carte France. L'épaisseur de chaque lien est proportionnelle à la probabilité du chemin ; le chemin critique est en couleur. Les probabilités de la présidentielle sont calculées à partir des probabilités conditionnelles à l'issue du budget.</p></div>
  <div class="row" style="margin-bottom:12px"><span class="pill acc">France</span><span class="pill neutral" title="phase Listes">Monde · à venir</span><span class="pill neutral">Long terme · à venir</span></div>
  <div class="svgwrap">${s}</div><p class="small muted mobile-hint" style="margin:6px 0 0">Faites glisser la carte vers la gauche pour voir la présidentielle. Chaque boîte ouvre sa fiche.</p>
  <div class="section"><h4>Scénarios France</h4><div class="tablewrap"><table><thead><tr><th>Scénario</th><th>Probabilité</th><th>Via budget adopté</th><th>Via budget non adopté</th></tr></thead><tbody>
  ${scen.map(x=>`<tr><td>Victoire ${x.nom==="Gauche"?"de la gauche":x.nom==="RN"?"du RN":x.nom==="Bloc central"?"du bloc central":"de la droite LR ou autre"}${x.i===best[1]?' <span class="pill acc">chemin critique</span>':""}</td><td class="num">${x.p} %</td><td class="num">${fr(x.v1,1)} pts</td><td class="num">${fr(x.v2,1)} pts</td></tr>`).join("")}
  </tbody></table></div><p class="small muted" style="margin:0">${esc(pre.noteChemin)}</p></div>`;
}

function indicateurs(){return `<div class="view-h"><h2>Indicateurs structurels</h2><p>Chaque indicateur est la moyenne des notes de ses sous-indicateurs, chacune calculée par position entre des seuils fixés à l'avance.</p></div>
  <div class="grid g2">${D.indicateurs.map(indCard).join("")}</div>
  <div class="section"><h4>Proposés, à arbitrer en phase Listes (8 retenus au total)</h4><div class="chips">${D.indicateursProposes.map(n=>`<span class="pill neutral">${esc(n)}</span>`).join("")}</div></div>`}

function lineChart(si){
  const pts=si.serie,W=640,H=230,L=40,R=16,T=16,B=30;const xs=pts.map(p=>p[0]),x0=Math.min(...xs),x1=Math.max(...xs);const y0=60,y1=130;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dette publique en pourcentage du PIB de 2007 à 2026">`;
  s+=`<rect x="${L}" y="${Y(130)}" width="${W-L-R}" height="${Y(120)-Y(130)}" fill="var(--crit-soft)"/><rect x="${L}" y="${Y(120)}" width="${W-L-R}" height="${Y(100)-Y(120)}" fill="var(--warn-soft)"/>`;
  [60,80,100,120].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${v}</text>`});
  [2008,2012,2016,2020,2024].forEach(v=>{s+=`<text x="${X(v)}" y="${H-10}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${v}</text>`});
  s+=`<text x="${L+8}" y="${Y(120)-5}" font-size="11" fill="var(--crit)">seuil critique 120 %</text><text x="${L+8}" y="${Y(100)-5}" font-size="11" fill="var(--warn)">seuil de tension 100 %</text>`;
  s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.2" points="${pts.map(p=>X(p[0])+","+Y(p[1])).join(" ")}"/>`;
  const last=pts[pts.length-1];s+=`<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="4.5" fill="var(--accent)"/><text x="${X(last[0])-8}" y="${Y(last[1])-9}" text-anchor="end" font-size="12" font-weight="600" font-family="IBM Plex Mono, monospace" fill="var(--ink)">${fr(last[1])} %</text>`;
  return s+`</svg>`}
function spreadChart(si){
  const pts=si.points,W=640,H=170,L=40,R=16,T=14,B=28;const y0=60,y1=160;const X=i=>L+i/(pts.length-1)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Écart OAT-Bund du 18 septembre au 1er octobre 2026">`;
  s+=`<rect x="${L}" y="${Y(160)}" width="${W-L-R}" height="${Y(100)-Y(160)}" fill="var(--crit-soft)"/>`;
  [60,100,150].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${v===150?'stroke-dasharray="4 3"':""}/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${v}</text>`});
  s+=`<text x="${W-R-4}" y="${Y(150)-5}" text-anchor="end" font-size="11" fill="var(--muted)">150 pb · plus haut 2011-2012, prévision P-005</text>`;
  pts.forEach((p,i)=>{s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${p[0]}</text>`});
  s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.2" points="${pts.map((p,i)=>X(i)+","+Y(p[1])).join(" ")}"/>`;
  const l=pts.length-1;s+=`<circle cx="${X(l)}" cy="${Y(pts[l][1])}" r="4.5" fill="var(--accent)"/><text x="${X(l)-8}" y="${Y(pts[l][1])-8}" text-anchor="end" font-size="12" font-weight="600" font-family="IBM Plex Mono, monospace" fill="var(--ink)">${pts[l][1]} pb</text>`;
  return s+`</svg>`}

function indPage(id){const ind=D.indicateurs.find(i=>i.id===id);if(!ind)return synthese();const n=noteInd(ind);const [c,l]=etat(n);
  const sis=ind.sous.map(siById);
  const evs=D.actualite.filter(e=>e.effets.some(f=>f.cible===id||ind.sous.includes(f.cible)));
  const prev=D.previsionsSimples.filter(p=>p.ind===id);
  return `<div class="crumb"><button class="ref" data-go="indicateurs">Indicateurs</button> / ${esc(ind.nom)}</div>
  <div class="view-h" style="margin-top:6px"><h2>${esc(ind.nom)} · ${esc(ind.echelle)}</h2><p>${esc(ind.definition)}</p></div>
  <div class="grid g2"><div class="card"><div class="row between"><h4>Note actuelle</h4><span class="pill ${c}">${l}</span></div><div class="row"><span class="big">${fr(n)}</span><span class="muted small">/ 10 ${trend(ind.tendance)} · marge ${fr(6.5-n)} avant critique</span></div>${gauge(n)}</div>
  <div class="card"><h4>Lecture</h4><p style="margin:0">${esc(ind.lecture)}</p><div class="small muted">Cité dans : ${ind.pivots.map(p=>link(p)).join(", ")}${prev.length?", "+prev.map(p=>`<button class="ref" data-go="previsions">${p.id}</button>`).join(", "):""}${evs.length?`, ${evs.length} faits d'actualité`:""}</div></div></div>
  <div class="section"><h4>Sous-indicateurs</h4><div class="card"><div class="list">${sis.map(s=>{const sc=score(s);const [cc,ll]=etat(sc);return `<div class="grid" style="grid-template-columns:minmax(0,1.4fr) minmax(90px,1fr) auto;gap:6px 14px;align-items:center">
    <div style="min-width:0"><div style="font-weight:600">${esc(s.nom)} ${trend(s.tendance)}</div><div class="small muted">${esc(s.date)} · ${esc(s.precedent)} · <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.source)}</a> · confiance ${esc(s.confiance)}</div></div>
    <div><div class="si-pos" role="img" aria-label="note ${fr(sc)} sur 10"><i style="left:${sc*10}%"></i></div><div class="small muted" style="margin-top:6px">${esc(marge(s))}</div></div>
    <div style="text-align:right"><div class="num" style="font-size:17px;font-weight:500">${esc(s.affiche)}</div><span class="pill ${cc}">${ll}</span></div></div>`}).join("")}</div></div></div>
  <div class="grid g2" style="margin-top:22px">
    <div class="section"><h4>Dette publique, % du PIB</h4><div class="card chart">${lineChart(siById("SI-01-01"))}<div class="small muted">${esc(siById("SI-01-01").serieSource)}</div></div></div>
    <div class="section"><h4>Écart OAT-Bund 10 ans, en points de base</h4><div class="card chart">${spreadChart(siById("SI-01-04"))}<div class="small muted">Relevés ponctuels de septembre ; série quotidienne Banque de France et Bundesbank à brancher sur la collecte automatique.</div></div></div>
  </div>
  <div class="section"><h4>Actualité liée</h4><div class="card"><div class="list">${evs.map(e=>`<div><span class="small muted num">${dfr(e.date)}</span><div>${esc(e.titre)}</div></div>`).join("")}</div></div></div>`}

function sousInd(){const f=window.__f||"tous";const st=["tous","validé","en observation","candidat","rejeté"];
  const rows=D.sousIndicateurs.filter(s=>f==="tous"||s.statut===f);
  return `<div class="view-h"><h2>Sous-indicateurs</h2><p>Les données brutes qui alimentent les indicateurs structurels, avec leur source, leur date et leur statut dans le cycle de vie.</p></div>
  <div class="chips" style="margin-bottom:12px">${st.map(x=>`<button class="chip" aria-pressed="${x===f}" onclick="window.__f='${x}';render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div>
  ${rows.length?`<div class="tablewrap"><table><thead><tr><th>Sous-indicateur</th><th>Valeur</th><th>État</th><th>Marge</th><th>Mesure</th><th>Confiance</th><th>Statut</th><th>Source</th></tr></thead><tbody>
  ${rows.map(s=>{const [c,l]=etat(score(s));return `<tr><td>${link(s.id,s.nom)}<div class="small muted">${link(s.ind,refLabel(s.ind))}</div></td><td class="num" style="white-space:nowrap">${esc(s.affiche)}</td><td><span class="pill ${c}">${l}</span></td><td class="small">${esc(marge(s))}</td><td class="small">${esc(s.date)}<div class="muted">${esc(s.frequence)}</div></td><td class="small">${esc(s.confiance)}</td><td class="small">${esc(s.statut)}</td><td class="small"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.source)}</a></td></tr>`}).join("")}
  </tbody></table></div>`:`<div class="note">Aucun sous-indicateur avec ce statut pour l'instant. Les indicateurs candidats apparaîtront ici après le premier post-mortem.</div>`}`}

function pivots(){return `<div class="view-h"><h2>Moments pivots</h2><p>Moments à fort impact dont l'issue n'est pas écrite. Un sous-pivot conditionne les probabilités du pivot qu'il alimente.</p></div>
  <div class="grid g2">${D.pivots.map(pivotCard).join("")}</div>
  <div class="note" style="margin-top:16px">Autres pivots envisagés pour la phase Listes : Gaza, Iran et détroit d'Ormuz, climat. Chacun aura une section « Réalité humaine » placée avant les probabilités.</div>`}

function pivotPage(id){const p=D.pivots.find(x=>x.id===id);if(!p)return pivots();
  const qs=p.questions.map(q=>{
    if(q.conditionnelle){const {glob,c1,c2,pB1}=questionDist(q);
      return `<div class="card"><h3>${esc(q.texte)}</h3><div class="small muted">Probabilité globale calculée à partir de l'issue du ${link(q.conditionnelle)} (adopté ${pB1} %, non adopté ${100-pB1} %).</div>${hypBars(q.hypotheses,glob)}
      <div class="tablewrap" style="margin-top:6px"><table><thead><tr><th>Hypothèse</th><th>Si budget adopté</th><th>Si non adopté</th><th>Globale</th></tr></thead><tbody>${q.hypotheses.map((h,i)=>`<tr><td>${esc(h.nom)}</td><td class="num">${c1[i]} %</td><td class="num">${c2[i]} %</td><td class="num"><b>${glob[i]} %</b></td></tr>`).join("")}</tbody></table></div>
      <div class="small muted">Résolution : ${esc(q.resolution)}</div></div>`}
    const d=hypsMedian(q.hypotheses);const ext=q.hypotheses.some(h=>h.externe!=null)?q.hypotheses.map(h=>h.externe):null;
    return `<div class="card"><h3>${esc(q.texte)}</h3>${hypBars(q.hypotheses,d,{ranges:q.hypotheses.map(h=>h.estimations),ext})}
    <div class="small muted">Barre : médiane des trois estimations · crochets : écart entre estimateurs${ext?` · <span style="color:var(--warn)">trait orangé</span> : ${esc(q.externeSource)} (<a href="${esc(q.externeUrl)}" target="_blank" rel="noopener">source</a>)`:""}</div>
    <div class="small muted">Résolution : ${esc(q.resolution)}</div></div>`}).join("");
  const est=p.questions.map(q=>q.hypotheses.map(h=>{const v=h.estimations||null;return v?`<tr><td>${esc(h.nom)}</td>${v.map(x=>`<td class="num">${x} %</td>`).join("")}</tr>`:`<tr><td>${esc(h.nom)}</td>${[0,1,2].map(k=>`<td class="num">${h.si.B1[k]} / ${h.si.nonB1[k]}</td>`).join("")}</tr>`}).join("")).join("");
  const evs=D.actualite.filter(e=>p.actualite.includes(e.id));
  return `<div class="crumb"><button class="ref" data-go="pivots">Pivots</button> / ${esc(p.nom)}</div>
  <div class="view-h" style="margin-top:6px"><div class="row"><h2>${esc(p.nom)}</h2><span class="pill ${p.type==="sous-pivot"?"neutral":"acc"}">${p.type==="sous-pivot"?"Sous-pivot":"Pivot"}</span></div><p>${esc(p.phrase)}</p>
  <div class="small muted">Échéance ${dfr(p.echeance)} · dernière révision ${dfr(D.meta.releve)}${p.amont.length?` · dépend de ${p.amont.map(a=>link(a)).join(", ")}`:""}${p.aval.length?` · alimente ${p.aval.map(a=>link(a)).join(", ")}`:""}</div></div>
  ${p.realiteHumaine?`<div class="section"><h4>Réalité humaine</h4><div class="card">${esc(p.realiteHumaine)}</div></div>`:""}
  <div class="section"><h4>Questions et hypothèses</h4>${qs}</div>
  <div class="section"><h4>Évolution</h4><div class="note">Première estimation le ${dfr(D.meta.releve)}. La courbe de chaque hypothèse apparaîtra à la prochaine révision, avec les faits marquants pointés sur l'axe.</div></div>
  <div class="section"><h4>Raisonnement</h4><div class="grid g2"><div class="card"><h3>Taux de base</h3><ul style="margin:0;padding-left:18px">${p.tauxDeBase.map(t=>`<li>${esc(t)}</li>`).join("")}</ul><div class="small muted">Voir aussi les ${`<button class="ref" data-go="precedents">précédents historiques</button>`}.</div></div>
  <div class="card"><h3>Table de conversion</h3><div class="list">${p.conversion.map(c=>`<div><div class="small" style="font-weight:600">${esc(c.facteur)}</div><div class="small muted">${esc(c.effet)}</div></div>`).join("")}</div>${p.indicateursDirects.length?`<div class="small muted">Indicateurs branchés directement : ${p.indicateursDirects.map(i=>link(i)).join(", ")}</div>`:`<div class="small muted">${esc(p.noteChemin||"")}</div>`}</div></div>
  <div class="tablewrap"><table><thead><tr><th>Hypothèse</th>${D.meta.estimateurs.map(e=>`<th>${esc(e)}</th>`).join("")}</tr></thead><tbody>${est}</tbody></table></div>
  <div class="small muted">${p.questions.some(q=>q.conditionnelle)?"Pour la question conditionnelle : « si adopté / si non adopté ». ":""}${esc(D.meta.methode)}</div></div>
  <div class="section"><h4>Projections sur les indicateurs</h4><div class="card"><div class="list">${p.projections.map(x=>{const h=p.questions[0].hypotheses.find(h=>h.id===x.hyp);return `<div><div style="font-weight:600">${esc(h?h.nom:x.hyp)}</div><div class="small muted">${esc(x.texte)}</div></div>`}).join("")}</div></div></div>
  <div class="section"><h4>Déclencheurs</h4><div class="card"><div class="list">${p.declencheurs.map(x=>`<div class="row between"><div style="min-width:0;flex:1 1 240px">${esc(x.texte)}<div class="small muted">vers : ${esc(x.vers)}</div></div><span class="pill neutral">${esc(x.date||x.distance)}</span></div>`).join("")}</div></div></div>
  <div class="section"><h4>Actualité liée</h4><div class="card"><div class="list">${evs.map(e=>`<div><span class="small muted num">${dfr(e.date)}</span><div>${esc(e.titre)}</div></div>`).join("")}</div></div></div>`}

function actualite(){return `<div class="view-h"><h2>Actualité</h2><p>Faits datés et sourcés, avec ce qu'ils font bouger. Les fiches analysées (post-mortem) apparaîtront ici pour les événements majeurs.</p></div>
  <div class="card timeline"><div class="list">${D.actualite.map(e=>`<div class="ev"><time datetime="${e.date}">${dfr(e.date).replace(" 2026","")}</time><div style="min-width:0;display:flex;flex-direction:column;gap:6px">
  <div style="font-weight:600">${esc(e.titre)}</div><div class="small">${esc(e.resume)}</div>
  <div class="chips">${e.effets.map(f=>f.cible==="IS-futur"?`<span class="pill neutral">${esc(f.texte)}</span>`:`<span class="pill acc">${esc(refLabel(f.cible))} · ${esc(f.texte)}</span>`).join("")}</div>
  <div class="small muted"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.source)}</a> · confiance ${esc(e.confiance)}</div></div></div>`).join("")}</div></div>`}

function previsions(){const fc=forecasts();return `<div class="view-h"><h2>Registre des prévisions</h2><p>Chaque prévision est figée à son émission. Une révision crée une nouvelle ligne ; l'ancienne reste visible. Le registre fait foi dans l'historique du dépôt.</p></div>
  <div class="tablewrap"><table><thead><tr><th>Réf.</th><th>Question</th><th>Probabilités</th><th>Échéance</th><th>Émise</th><th>Référence externe</th><th>Résultat</th></tr></thead><tbody>
  ${fc.map(f=>`<tr><td class="num small">${esc(f.id)}</td><td style="min-width:220px">${esc(f.texte)}<div class="small muted">${f.piv?link(f.piv):link(f.ind)}${f.calc?" · calculée":" · médiane de 3"}</div></td><td class="small num" style="min-width:150px">${f.dist.map(([n,v])=>`${esc(n)} <b>${v}</b>`).join("<br>")}</td><td class="small num">${dfr(f.echeance)}</td><td class="small num">${dfr(D.meta.releve)}</td><td class="small">${f.ext?f.dist.map((d,i)=>f.ext[i]!=null?`${esc(d[0])} ${f.ext[i]} %`:"").filter(Boolean).join("<br>")+`<div class="muted">${esc(f.extSrc)}</div>`:'<span class="muted">à relever (Metaculus, Polymarket)</span>'}</td><td><span class="pill neutral">En attente</span></td></tr>`).join("")}
  </tbody></table></div>
  <p class="small muted">Lignes de base pour le score : « statu quo » et « 50 % partout ». Probabilités bornées à 5-95 % par hypothèse.</p>`}

function quotidien(){return `<div class="view-h"><h2>Questions du quotidien</h2><p>Lecture des indicateurs appliquée à des décisions personnelles.</p></div>
  <div class="note">Les questions du quotidien sont personnelles : elles sont tenues dans un espace privé séparé, qui lit les indicateurs publiés sur cette page. Rien de personnel n'est publié ici.</div>`}

function precedents(){return `<div class="view-h"><h2>Précédents historiques</h2><p>Cas passés comparables, qui fournissent les taux de base des estimations.</p></div>
  <div class="tablewrap"><table><thead><tr><th>Cas</th><th>Type</th><th>Contexte</th><th>Issue</th><th>Durée</th></tr></thead><tbody>
  ${D.precedents.map(p=>`<tr><td style="font-weight:600;white-space:nowrap">${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.cas)}</a>`:esc(p.cas)}</td><td class="small">${esc(p.type)}</td><td class="small">${esc(p.contexte)}</td><td class="small">${esc(p.issue)}</td><td class="small">${esc(p.duree)}</td></tr>`).join("")}
  </tbody></table></div>`}

function methodologie(){return `<div class="view-h"><h2>Méthodologie</h2><p>Les règles complètes vivent dans le cahier des charges du projet ; voici l'essentiel et le vocabulaire commun.</p></div>
  <div class="grid g2"><div class="card"><h3>Règles clés</h3><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px" class="small">
  <li>Toute prévision est une question fermée, datée, avec un critère de résolution écrit à l'émission.</li>
  <li>Chaque estimation part d'un taux de base et du statu quo ; chaque ajustement est écrit.</li>
  <li>Probabilité = médiane de trois estimateurs indépendants ; scénarios et probabilités globales calculés.</li>
  <li>Un indicateur agit sur un pivot par un seul chemin ; pas de boucle entre pivots.</li>
  <li>Un indicateur trouvé après coup n'est validé que sur des événements futurs.</li>
  <li>Le relevé applique les règles ; seule l'analyse trimestrielle peut les changer, au journal.</li>
  <li>Au-delà de 3 ans : scénarios, pas de prévision notée.</li></ul></div>
  <div class="card"><h3>Journal des révisions</h3><div class="list">${D.journal.map(j=>`<div><div class="row"><span class="small muted num">${dfr(j.date)}</span><span class="pill neutral">${esc(j.type)}</span></div><div class="small" style="margin-top:4px">${esc(j.texte)}</div></div>`).join("")}</div></div></div>
  <div class="section"><h4>Collecte automatique</h4>${collecteCard()}</div>
  <div class="section"><h4>Dictionnaire</h4>${_dictEnd()}`;}
let C=null;
function collecteCard(){if(!C)return `<div class="note">La collecte automatique (GitHub Actions, chaque nuit) n'a pas encore produit de données.</div>`;
  const rows=Object.entries(C.series).map(([k,s])=>{const d=s.donnees&&s.donnees.length?s.donnees[s.donnees.length-1]:null;
    const val=Array.isArray(d)?`${esc(d[0])} : <b class="num">${typeof d[1]==="number"?fr(d[1],d[1]%1?1:0):esc(d[1])}</b>`:(Array.isArray(s.donnees)?`${s.donnees.length} marchés relevés`:"—");
    return `<tr><td>${esc(s.nom)}<div class="small muted">${esc(s.source)}</div></td><td class="small">${val}</td><td><span class="pill ${s.statut==="ok"?"ok":"crit"}">${s.statut==="ok"?"À jour":"Échec"}</span></td></tr>`}).join("");
  return `<div class="tablewrap"><table><thead><tr><th>Série</th><th>Dernière valeur</th><th>État</th></tr></thead><tbody>${rows}</tbody></table></div><p class="small muted" style="margin:0">Dernière exécution : ${esc(C.execution.replace("T"," ").replace("Z"," UTC"))}. Collecte sans IA ; les relevés de Claude intègrent ces valeurs aux sous-indicateurs.</p>`}
function _dictEnd(){return `<div class="card"><dl class="dict">${D.dictionnaire.map(([t,d])=>`<dt>${esc(t)}</dt><dd class="small">${esc(d)}</dd>`).join("")}</dl></div></div>`}

/* --- démarrage --- */
buildTabs();
fetch("data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{D=j;
  $("#releve").innerHTML=`Relevé du <b>${dfr(D.meta.releve)}</b> · ${esc(D.meta.version)}`;render();
  fetch("data/collecte.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(c=>{if(c){C=c;if((location.hash||"").includes("methodologie"))render()}}).catch(()=>{})})
  .catch(()=>{$("#view").innerHTML=`<div class="note">Les données n'ont pas pu être chargées (data.json). Rechargez la page ; si le problème persiste, le dernier relevé a échoué.</div>`});
</script>

</body>
</html>
