<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Psychohistoire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
<style>
/* Layout : navigation latérale par sections sur ordinateur, deux rangées sur téléphone ; colonne de contenu de 820px */
:root{
  --bg:#FBFBFA; --surface:#FFFFFF; --soft:#F3F3F1; --ink:#1C1C1A; --muted:#62625D; --line:#E4E3DF;
  --accent:#2F4F8F; --accent-soft:rgba(47,79,143,.09); --accent-mid:rgba(47,79,143,.35);
  --ok:#2E7558; --warn:#9A6513; --crit:#A8382B; --ok-soft:rgba(46,117,88,.11); --warn-soft:rgba(154,101,19,.12); --crit-soft:rgba(168,56,43,.10);
  --font:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --s-sm:13px; --s-md:15px; --s-lg:19px; --s-xl:28px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161615; --surface:#1E1E1C; --soft:#252523; --ink:#ECEBE7; --muted:#A3A29C; --line:#33332F;
  --accent:#93AEEB; --accent-soft:rgba(147,174,235,.12); --accent-mid:rgba(147,174,235,.4);
  --ok:#62B693; --warn:#D9A34A; --crit:#E07465; --ok-soft:rgba(98,182,147,.13); --warn-soft:rgba(217,163,74,.14); --crit-soft:rgba(224,116,101,.14);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161615; --surface:#1E1E1C; --soft:#252523; --ink:#ECEBE7; --muted:#A3A29C; --line:#33332F;
  --accent:#93AEEB; --accent-soft:rgba(147,174,235,.12); --accent-mid:rgba(147,174,235,.4);
  --ok:#62B693; --warn:#D9A34A; --crit:#E07465; --ok-soft:rgba(98,182,147,.13); --warn-soft:rgba(217,163,74,.14); --crit-soft:rgba(224,116,101,.14);
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--s-md)/1.6 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
p,.just{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);max-width:1180px;margin:0 auto;padding-inline:24px;gap:40px}
.side{position:sticky;top:0;align-self:start;height:100vh;padding-block:28px;overflow-y:auto}
.brand{font-weight:700;font-size:var(--s-lg);letter-spacing:-.01em;margin:0}
.releve{font-size:var(--s-sm);color:var(--muted);margin:2px 0 26px}
.nav-sec{margin-bottom:18px}
.nav-sec .h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.nav-sec button{all:unset;cursor:pointer;display:block;padding:5px 10px;margin-left:-10px;border-radius:6px;color:var(--ink);font-size:var(--s-md)}
.nav-sec button:hover{background:var(--soft)}
.nav-sec button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .about{font-size:var(--s-sm);color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:8px}
.topnav{display:none}
main{padding-block:32px 64px;min-width:0;max-width:820px}
.page-h{margin-bottom:28px}
.crumb{font-size:var(--s-sm);color:var(--muted);margin-bottom:6px}
h1.title{font-size:var(--s-xl);line-height:1.2;font-weight:700;letter-spacing:-.015em;margin:0 0 10px;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:68ch}
h2{font-size:var(--s-lg);font-weight:700;margin:0;line-height:1.3}
h3{font-size:var(--s-md);font-weight:700;margin:0;line-height:1.4}
.sec{margin-top:40px;min-width:0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:10px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.muted{color:var(--muted)}
.sm{font-size:var(--s-sm)}
.b{font-weight:700}
.big{font-size:var(--s-xl);font-weight:700;line-height:1;letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0 24px}
.box{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.go{cursor:pointer;transition:border-color .15s}
.go:hover{border-color:var(--accent-mid)}
.rows > *{padding-block:14px;border-top:1px solid var(--line)}
.rows > *:first-child{border-top:0;padding-top:0}
.rows > *:last-child{padding-bottom:0}
.rowx{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.sp{justify-content:space-between}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.crit{background:var(--crit-soft);color:var(--crit)}
.tag.n{background:var(--soft);color:var(--muted)} .tag.a{background:var(--accent-soft);color:var(--accent)}
.lnk{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.lnk:hover{text-decoration:underline;text-underline-offset:2px}
.rowlink{cursor:pointer}
.rowlink:hover .b,.rowlink:hover > div:last-child{color:var(--accent)}
.term{color:var(--accent);border-bottom:1px dotted var(--accent-mid);cursor:help}
#pop{position:absolute;z-index:30;width:min(300px,calc(100vw - 32px));background:var(--ink);color:var(--bg);font-size:var(--s-sm);line-height:1.5;padding:11px 13px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#pop b{display:block;margin-bottom:3px}
details.more > summary{cursor:pointer;color:var(--accent);font-size:var(--s-sm);font-weight:600;list-style:none;display:inline-flex;gap:6px}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"+";display:inline-block;width:12px}
details.more[open] > summary::before{content:"−"}
details.more > .in{margin-top:10px;display:flex;flex-direction:column;gap:10px}
details.block{border-top:1px solid var(--line)}
details.block:last-child{border-bottom:1px solid var(--line)}
details.block > summary{cursor:pointer;list-style:none;padding:14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;font-weight:700}
details.block > summary::-webkit-details-marker{display:none}
details.block > summary::after{content:"+";color:var(--muted);font-weight:400;font-size:18px;line-height:1.2}
details.block[open] > summary::after{content:"−"}
details.block > .in{padding-bottom:18px;display:flex;flex-direction:column;gap:12px}
.gauge{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--ok-soft) 0 35%,var(--warn-soft) 35% 65%,var(--crit-soft) 65% 100%)}
.gauge i{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-1.5px)}
.hyp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:baseline}
.hyp + .hyp{margin-top:12px}
.hyp .v{font-weight:700;text-align:right;white-space:nowrap}
.hyp .v span{font-weight:400;color:var(--muted);font-size:var(--s-sm);margin-left:8px}
.bar{grid-column:1 / -1;position:relative;height:6px;background:var(--soft);border-radius:3px}
.bar b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.hyp:not(.dom) .bar b{background:var(--accent-mid)}
.bar .r{position:absolute;top:-3px;height:12px;border-left:1.5px solid var(--muted);border-right:1.5px solid var(--muted)}
.bar .e{position:absolute;top:-4px;width:3px;height:14px;background:var(--warn);border-radius:1px}
.stack{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--soft)}
.stack span{display:block;height:100%}
table{border-collapse:collapse;width:100%;font-size:var(--s-sm)}
th{font-weight:700;text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--muted)}
td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.hl td{background:var(--accent-soft)}
.tw{overflow-x:auto}
.svgw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px}
.svgw svg{display:block;min-width:700px;width:100%;height:auto}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.empty{color:var(--muted);font-size:var(--s-sm);border:1px dashed var(--line);border-radius:10px;padding:14px}
dl.dict{display:grid;grid-template-columns:200px minmax(0,1fr);margin:0}
dl.dict dt,dl.dict dd{margin:0;padding:10px 0;border-top:1px solid var(--line)}
dl.dict dt{font-weight:700;padding-right:16px}
footer{font-size:var(--s-sm);color:var(--muted)}
.mob{display:none}
@media (max-width:860px){
  .shell{display:block;padding-inline:16px}
  .side{display:none}
  .topnav{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding-inline:16px}
  .topnav .t1{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-top:12px}
  .topnav .t1 .brand{font-size:17px}
  .topnav .t1 .releve{margin:0;font-size:12px}
  .topnav .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:9px}
  .topnav .row::-webkit-scrollbar{display:none}
  .topnav .r1 button{all:unset;cursor:pointer;font-weight:700;font-size:var(--s-sm);padding:6px 12px;border-radius:999px;color:var(--muted);white-space:nowrap;background:var(--soft)}
  .topnav .r1 button[aria-current="true"]{background:var(--ink);color:var(--bg)}
  .topnav .r2{padding-top:0}
  .topnav .r2 button{all:unset;cursor:pointer;font-size:var(--s-sm);padding:6px 0;margin-right:14px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}
  .topnav .r2 button[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
  main{padding-block:22px 40px}
  .mob{display:block}
  table.resp thead{display:none}
  table.resp,table.resp tbody,table.resp tr,table.resp td{display:block;width:100%}
  table.resp tr{padding:12px 0;border-bottom:1px solid var(--line)}
  table.resp tr:last-child{border-bottom:0}
  table.resp td{border:0;padding:2px 0}
  table.resp td[data-l]{display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.resp td[data-l]::before{content:attr(data-l);color:var(--muted);flex:0 0 auto;text-align:left}
  table.resp td.lead{font-weight:700;margin-bottom:4px}
  table.resp td.blk{display:block;text-align:left}
  table.resp td.blk::before{display:block;margin-bottom:4px}
  dl.dict{grid-template-columns:1fr} dl.dict dd{border-top:0;padding-top:0}
  h1.title{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--line-strong:#C9C8C2;--zone:rgba(120,110,80,.05);--zone-line:#D2CFC4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--line-strong:#4A4A45;--zone:rgba(255,255,255,.03);--zone-line:#45443F}}
:root[data-theme="dark"]{--line-strong:#4A4A45;--zone:rgba(255,255,255,.03);--zone-line:#45443F}
.tag.z{background:var(--zone);color:var(--muted);border:1px dashed var(--zone-line)}
.apres{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--s-sm);color:var(--muted);background:var(--zone);border:1px dashed var(--zone-line);border-radius:6px;padding:5px 10px}
.apres .zl{font-weight:700}
.per{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.zonebox{background:var(--zone);border:1px dashed var(--zone-line);border-radius:10px;padding:2px 12px 12px;margin-top:16px}
.ncard{display:flex;flex-direction:column;gap:7px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:8px}
.crit-l{color:var(--accent);font-weight:700}
.zonesec{background:var(--zone);border:1px dashed var(--zone-line);border-radius:12px;padding:4px 16px 16px}
.svgw svg{min-width:760px}
tr.old td{color:var(--muted)}
.desk{display:block}
@media (max-width:860px){.desk{display:none}}
.mapctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;font-size:var(--s-sm);font-weight:700;padding:6px 14px;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.mapctl label{display:flex;align-items:center;gap:8px;color:var(--muted);flex:1 1 280px;justify-content:flex-end}
.mapctl select{font:inherit;font-size:var(--s-sm);color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;max-width:100%;min-width:0;flex:0 1 380px}
@media (max-width:860px){.mapctl label{justify-content:flex-start;flex-basis:100%;flex-wrap:wrap;min-width:0}.mapctl select{flex:1 1 100%;width:100%;max-width:100%}}
.tmap .svgw svg{min-width:680px}
</style>

<body>
<div class="topnav" id="topnav"></div>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main id="view" tabindex="-1"></main>
</div>
<div id="pop" role="tooltip" hidden></div>

<script>
document.documentElement.lang="fr";
const NAV=[
  ["vue","Vue d'ensemble",[["synthese","Synthèse"],["carte","Carte"]]],
  ["ind","Indicateurs",[["indicateurs","Indicateurs structurels"],["sous-indicateurs","Sous-indicateurs"]]],
  ["suivi","Suivi",[["pivots","Moments pivots"],["actualite","Actualité"],["previsions","Prévisions"]]],
  ["ref","Référence",[["precedents","Précédents"],["methodologie","Méthode et glossaire"]]]
];
let D=null,C=null,M=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fr=(n,d=1)=>Number(n).toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d});
const P=n=>`${n} %`;
const dfr=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d)).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"})};
const median=a=>{const s=[...a].sort((x,y)=>x-y);return s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2};
function to100(v){const t=v.reduce((a,b)=>a+b,0)||1;const raw=v.map(x=>x*100/t);const fl=raw.map(Math.floor);let r=100-fl.reduce((a,b)=>a+b,0);raw.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(r>0){fl[i]++;r--}});return fl}

/* --- glossaire --- */
const G={
  "rv":["Rapport de vraisemblance","À quel point un fait est plus probable si l'issue se produit que si elle ne se produit pas. 1 : fait neutre ; 2 : deux fois plus probable. Il multiplie les cotes de l'issue, puis le réseau propage l'effet."],
  "declencheur":["Déclencheur daté","Événement attendu à une date connue qui peut faire basculer un pivot dans un sens ou dans l'autre."],
  "portee":["Portée","Probabilité des pivots suivis selon chaque issue du nœud touché : l'effet maximal qu'un fait pourrait avoir s'il faisait basculer ce nœud."],
  "cas-a":["Sans effet","Fait sans lien avec un nœud du modèle, ou trop faible pour le déplacer d'au moins 3 points. Consigné avec son motif."],
  "cas-b":["Donnée","Fait qui tranche une issue ou mesure une variable (vote, décision, série publiée). Appliqué sans jugement."],
  "cas-c":["Évidence","Fait qui renseigne un nœud non tranché. Trois évaluateurs estiment à quel point il est plus probable sous une issue que sous l'autre ; le réseau se met à jour en conséquence."],
  "cas-d":["Paramètre","Fait qui change une relation entre nœuds plutôt que la probabilité d'un nœud. Seules les lignes concernées des tables sont révisées."],
  "cas-f":["En observation","Fait contesté, ou dont l'effet passe d'abord par une donnée à venir (sondage, série officielle). Aucune mise à jour avant la date de réexamen."],
  "cas-e":["Hors modèle","Fait qui ne correspond à aucun nœud. Il donne lieu à une question à part et peut faire entrer un nœud à l'analyse trimestrielle."],
  "pivot":["Moment pivot","Événement à fort impact dont l'issue n'est pas écrite d'avance, décliné en hypothèses auxquelles on attribue une probabilité."],
  "sous-pivot":["Sous-pivot","Moment pivot qui en conditionne un autre : ses issues changent les probabilités du pivot situé en aval."],
  "anticipé":["Pivot anticipé","Crise qui n'a pas encore eu lieu mais dont les signaux sont visibles, comme une mobilisation sociale contre le budget."],
  "projection":["Projection","Pivot postérieur à l'élection, jusqu'en septembre 2028. Il est calculé à partir des issues de la présidentielle."],
  "sensibilite":["Écart d'influence","Variation, en points, de l'issue principale d'un pivot selon l'issue du pivot amont. Plus l'écart est grand, plus le lien pèse."],
  "marge":["Marge","Distance entre la valeur actuelle et le prochain seuil. Plus elle est faible, plus un petit choc suffit à changer d'état."],
  "critique":["Chemin critique","Les liens où l'issue d'un pivot amont fait le plus varier le pivot aval, et qui mènent au scénario dominant."],
  "calcule":["Probabilité calculée","Elle n'est pas estimée directement : elle combine les probabilités conditionnelles de tout le réseau de pivots."],
  "mediane":["Médiane de trois","Trois agents estiment chaque probabilité sans voir les réponses des autres ; on retient la valeur du milieu."],
  "fourchette":["Fourchette","Résultat le plus bas et le plus haut parmi les trois estimateurs, calculés chacun sur tout le réseau."],
  "note":["Note sur 10","Moyenne des sous-indicateurs, chacun noté selon sa position entre des seuils fixés à l'avance. Plus elle est haute, plus la situation est tendue."],
  "externe":["Référence externe","Estimation publique (marché de prédiction, modèle de sondages) relevée après les nôtres, pour comparer les résultats."],
  "confiance":["Confiance","Qualité de la mesure : forte pour une statistique officielle, moyenne pour une source secondaire ou unique."],
  "fige":["Registre figé","Une prévision n'est jamais modifiée après son émission : une révision crée une nouvelle ligne, et l'historique public garde tout."],
  "OAT":["OAT","Obligation assimilable du Trésor : titre de dette de l'État français. Son taux à 10 ans sert de référence."],
  "Bund":["Bund","Obligation de l'État allemand, considérée comme la référence sans risque de la zone euro."],
  "pb":["Point de base","Un centième de point de pourcentage : 100 pb correspondent à 1 point."],
  "PIB":["PIB","Produit intérieur brut : la richesse produite en un an. Dette et déficit s'expriment en pourcentage du PIB."],
  "BCE":["BCE","Banque centrale européenne. Elle fixe les taux directeurs et peut acheter de la dette publique en cas de crise."],
  "RN":["RN","Rassemblement national, parti d'extrême droite. Candidate déclarée : Marine Le Pen, avec Jordan Bardella en relais possible."],
  "LFI":["LFI","La France insoumise, parti de gauche radicale. Candidat déclaré : Jean-Luc Mélenchon."],
  "LR":["LR","Les Républicains, parti de droite. Candidat désigné : Bruno Retailleau."],
  "PS":["PS","Parti socialiste. Son candidat sera désigné par une primaire avec Place publique les 9 et 10 octobre 2026."],
  "APL":["APL","Aide personnalisée au logement. Le budget 2027 prévoit de la supprimer pour environ 200 000 étudiants."],
  "loi spéciale":["Loi spéciale","Loi votée en urgence quand le budget n'est pas adopté au 31 décembre : l'État peut lever l'impôt, mais sans mesure nouvelle."],
  "censure":["Motion de censure","Vote de l'Assemblée qui renverse le gouvernement s'il réunit la majorité absolue des députés, soit 289 voix."],
  "ordonnance":["Ordonnance budgétaire","Article 47 de la Constitution : sans vote du Parlement sous 70 jours, le gouvernement peut appliquer son budget par ordonnance."],
  "Maastricht":["Critères de Maastricht","Règles européennes de 1992 : déficit public inférieur à 3 % du PIB et dette inférieure à 60 % du PIB."],
  "Sondax":["Sondax","Agrégateur de sondages qui publie un modèle de probabilités pour la présidentielle."],
  "Polymarket":["Polymarket","Marché de prédiction : les prix des paris reflètent la probabilité que les participants attribuent à chaque issue."],
  "Metaculus":["Metaculus","Plateforme de prévisions collectives, notée sur ses résultats passés."],
  "Brier":["Score de Brier","Écart au carré entre la probabilité annoncée et le résultat : 0 est parfait, 0,25 équivaut à répondre 50 % partout."],
  "taux de base":["Taux de base","Fréquence d'une issue dans les cas passés comparables. C'est le point de départ obligatoire de chaque estimation."]
};
const AUTO=["loi spéciale","taux de base","Maastricht","Polymarket","Metaculus","Sondax","censure","ordonnance","OAT","Bund","PIB","BCE","APL","RN","LFI","LR","PS","pb","Brier"];

function glossify(root){

  const scopes=new Map();

  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{const scope=n.parentElement.closest(".box,.sec,.page-h,tr,details,article,.ncard")||root;let seen=scopes.get(scope);if(!seen){seen=new Set();scopes.set(scope,seen)}
    let node=n,m;while(node&&(m=re.exec(node.nodeValue))){const key=m[2].replace(/\s/g," ");const start=m.index+m[1].length;
      if(seen.has(key)){node=node.splitText(start+m[2].length);continue}seen.add(key);
      const mid=node.splitText(start);const after=mid.splitText(m[2].length);const span=document.createElement("span");span.className="term";span.tabIndex=0;span.dataset.def=key;span.textContent=mid.nodeValue;mid.replaceWith(span);node=after}});

/* --- indicateurs --- */
function score(si){const [t0,t1,t2,tm]=si.seuils,v=si.valeur;const pts=[[t0,0],[t1,3.5],[t2,6.5],[tm,10]];if(v<=t0)return 0;if(v>=tm)return 10;for(let i=1;i<pts.length;i++){if(v<=pts[i][0]){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];return y0+(y1-y0)*(v-x0)/(x1-x0)}}return 10}
const etat=s=>s<3.5?["ok","Stable"]:s<6.5?["warn","Sous tension"]:["crit","Critique"];
function marge(si){const [,t1,t2]=si.seuils,v=si.valeur;const u=si.unite==="% du PIB"?"pt de PIB":si.unite==="%"?"pt":si.unite;const f=x=>si.unite==="pb"?fr(x,0):fr(x,1);
  if(si.unite.startsWith("rang")){if(v<t1)return `${fr(t1-v,1)} cran avant tension`;if(v<t2)return `${fr(t2-v,1)} cran avant critique`;return "seuil critique dépassé"}
  if(v<t1)return `${f(t1-v)} ${u} avant tension`;if(v<t2)return `${f(t2-v)} ${u} avant critique`;return `${f(v-t2)} ${u} au-delà du seuil critique`}
function seuilsTxt(si){const [,t1,t2]=si.seuils;const NOT=["","AAA","AA+","AA","AA-","A+","A","A-","BBB+","BBB"];const rk=si.unite.startsWith("rang");const f=x=>rk?NOT[x]||fr(x,1):si.unite==="pb"?fr(x,0):fr(x,1);
  const u=rk?"":si.unite==="pb"?" pb":" %";return `tension dès ${f(t1)}${u}, critique dès ${f(t2)}${u}`}
const siById=id=>D.sousIndicateurs.find(s=>s.id===id);
function noteInd(ind){const sc=ind.sous.map(id=>score(siById(id)));return sc.reduce((a,b)=>a+b,0)/sc.length}
const trend=t=>t==="hausse"?'<span class="tag crit">▲ se dégrade</span>':t==="baisse"?'<span class="tag ok">▼ s\'améliore</span>':'<span class="tag n">stable</span>';

/* --- réseau de pivots : calcul exact par énumération --- */
const N=id=>D.pivots.find(n=>n.id===id);
function cpts(k,ev){/* k = "med" ou index d'estimateur ; ev = mises à jour appliquées */
  const out={};D.pivots.forEach(n=>{out[n.id]={};for(const [key,tab0] of Object.entries(n.cpt)){const tab=(ev&&ev.rev[n.id+"|"+key])||tab0;const v=n.issues.map(o=>k==="med"?median(tab[o.id]):tab[o.id][k]);const pr=k==="med"?to100(v):v.map(x=>x*100/v.reduce((a,b)=>a+b,0));out[n.id][key]=pr.map(x=>x/100)}});return out}
/* --- mises à jour événementielles (protocole v1.3, section 10) --- */
const MAJ=()=>(D.majs||[]).filter(u=>u.statut!=="annulée").slice().sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id));
function evid(n){const ev={obs:{},lr:{},rev:{}};MAJ().slice(0,n).forEach(u=>{
  if(u.cas==="b")ev.obs[u.noeud]=u.issue;
  if(u.cas==="c"){const c=ev.lr[u.noeud]||{};for(const [o,v] of Object.entries(u.lr))c[o]=(c[o]||1)*v;ev.lr[u.noeud]=c}
  if(u.cas==="d")ev.rev[u.noeud+"|"+u.ligne]=u.cpt});return ev}
const groupOf=(par,out)=>{for(const [g,arr] of Object.entries(par.g))if(arr.includes(out))return g};
const keyOf=(n,a)=>n.parents.map(p=>groupOf(p,a[p.id])).join("_");
function joint(k,ev){ev=ev||M_EV;const T=cpts(k,ev);const res=[];const ns=D.pivots;
  (function rec(i,a,p){if(i===ns.length){res.push({a:{...a},p});return}const n=ns[i];const dist=T[n.id][keyOf(n,a)];const ob=ev.obs[n.id],lr=ev.lr[n.id];
    n.issues.forEach((o,j)=>{if(dist[j]>0&&(!ob||ob===o.id)){a[n.id]=o.id;rec(i+1,a,p*dist[j]*(lr&&lr[o.id]!=null?lr[o.id]:1))}});delete a[n.id]})(0,{},1);
  const z=res.reduce((t,x)=>t+x.p,0);res.forEach(x=>x.p/=z);return res}
let M_EV={obs:{},lr:{},rev:{}};
const margOf=J=>{const m={};D.pivots.forEach(n=>m[n.id]=n.issues.map(o=>prob(J,a=>a[n.id]===o.id)*100));return m};
const desc=id=>{const out=new Set();(function r(x){D.pivots.filter(c=>c.parents.some(p=>p.id===x)).forEach(c=>{if(!out.has(c.id)){out.add(c.id);r(c.id)}})})(id);return out};
const SUIVIS=()=>D.meta.suivis||[];
/* probabilité d'une issue suivie, conditionnée à chaque issue d'un nœud amont */
const portee=(id,J)=>{const n=N(id),d=desc(id);return SUIVIS().filter(([t])=>d.has(t)).map(([t,o])=>({t,o,v:n.issues.map(x=>{const pa=prob(J,a=>a[id]===x.id);return pa?Math.round(prob(J,a=>a[id]===x.id&&a[t]===o)/pa*100):null})}))};
/* fil : état initial puis chaque mise à jour */
function fil(){const L=MAJ();const pts=[];for(let i=0;i<=L.length;i++){const m=margOf(joint("med",evid(i)));pts.push({u:i?L[i-1]:null,m})}return pts}
const prob=(J,f)=>J.reduce((s,x)=>s+(f(x.a)?x.p:0),0);
function build(){M_EV=evid(MAJ().length);const Jm=joint("med"),Je=[0,1,2].map(k=>joint(k));
  const marg={},rng={};D.pivots.forEach(n=>{const m=n.issues.map(o=>prob(Jm,a=>a[n.id]===o.id)*100);marg[n.id]=to100(m);
    rng[n.id]=n.issues.map(o=>{const v=Je.map(J=>Math.round(prob(J,a=>a[n.id]===o.id)*100));return [Math.min(...v),Math.max(...v)]})});
  const sens={};D.pivots.forEach(n=>{const dom=n.issues[marg[n.id].indexOf(Math.max(...marg[n.id]))].id;n.parents.forEach(pp=>{const par=N(pp.id);
    const cond=par.issues.map(o=>{const pa=prob(Jm,a=>a[par.id]===o.id);return pa?prob(Jm,a=>a[par.id]===o.id&&a[n.id]===dom)/pa:null}).filter(x=>x!=null);
    sens[pp.id+">"+n.id]=Math.round((Math.max(...cond)-Math.min(...cond))*100)})});
  M={Jm,Je,marg,rng,sens}}
const dom=id=>{const n=N(id),m=M.marg[id],i=m.indexOf(Math.max(...m));return {o:n.issues[i],p:m[i],r:M.rng[id][i],i}};
const condTable=n=>{const keys=Object.keys(n.cpt);return keys.map(k=>({k,lab:k.split("_").map((g,i)=>{const par=N(n.parents[i].id);const ids=n.parents[i].g[g];return `${par.court} : ${ids.map(x=>par.issues.find(o=>o.id===x).court).join(" ou ")}`}).join(" · "),v:to100(n.issues.map(o=>median(n.cpt[k][o.id])))}))};

function mpe(J,c){let b=null;J.forEach(x=>{if(c&&!c(x.a))return;if(!b||x.p>b.p)b=x});return b}

    if(pt>0)tgt={t,o,pt,best:mpe(M.Jm,a=>a[t]===o),cp:id=>N(id).issues.map(x=>prob(M.Jm,a=>a[t]===o&&a[id]===x.id)/pt*100)}}
  const issueOf=id=>tgt?tgt.best.a[id]:base.a[id];
  const pOf=id=>{const n=N(id),j=n.issues.findIndex(x=>x.id===issueOf(id));return {j,ord:M.marg[id][j],sur:tgt?(id===tgt.t?null:Math.round(tgt.cp(id)[j])):M.marg[id][j]}};
  return {base,tgt,issueOf,pOf,diff:id=>!!tgt&&tgt.best.a[id]!==base.a[id]}}
function todayU(){const d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())}
function scaleOf(vue,L,PW){
  if(vue==="semaine"){const t=todayU(),dow=(new Date(t).getUTCDay()+6)%7,s=t-(dow+7)*DAY,e=s+11*7*DAY;
    const ticks=[];for(let k=0;k<=11;k++){const u=s+k*7*DAY,d=new Date(u);ticks.push([u,`${d.getUTCDate()} ${mois[d.getUTCMonth()]}`])}
    return {s,e,x:u=>L+(u-s)/(e-s)*PW,ticks,zone:null}}
  const s=dU("2026-10-01"),m=dU("2027-06-15"),e=dU("2028-10-01");
  const x=u=>u<=m?L+(u-s)/(m-s)*PW*.74:L+PW*.74+(u-m)/(e-m)*PW*.26;
  const ticks=[];for(let k=0;k<9;k++){const d=Date.UTC(2026,9+k,1),D0=new Date(d);ticks.push([d,D0.getUTCMonth()===0?`${mois[0]} 2027`:mois[D0.getUTCMonth()]])}
  [[2028,0],[2028,6]].forEach(([y,mm])=>ticks.push([Date.UTC(y,mm,1),`${mois[mm]} ${y}`]));
  return {s,e,x,ticks,zone:dU("2027-05-03")}}

  const t0=todayU();if(t0>=sc.s&&t0<=sc.e){const x=sc.x(t0);s+=`<line x1="${x}" y1="38" x2="${x}" y2="${H-8}" stroke="var(--accent)" stroke-dasharray="3 3"/>`+tx(x+3,14,"Aujourd'hui",'font-size="11" font-weight="700" fill="var(--accent)"')}
  const inWin=id=>{const u=dU(N(id).echeance);return u>=sc.s&&u<=sc.e};
  const vis=D.pivots.filter(n=>MAPV.vue==="macro"||inWin(n.id)).map(n=>n.id);
  const edgeHi=(a,b)=>pi.tgt?(pi.diff(a)||pi.diff(b)||b===pi.tgt.t||a===pi.tgt.t):(M.sens[a+">"+b]>=CRIT);
  D.pivots.forEach(n=>n.parents.forEach(p=>{if(!vis.includes(n.id)||!vis.includes(p.id))return;
    const xa=xc(dU(N(p.id).echeance)),ya=yc(p.id),xb=xc(dU(n.echeance)),yb=yc(n.id),hi=edgeHi(p.id,n.id);let d;
    if(Math.abs(xb-xa)>BW){const x1=xa+BW/2,x2=xb-BW/2-2,mx=(x1+x2)/2;d=`M${x1} ${ya} C ${mx} ${ya}, ${mx} ${yb}, ${x2} ${yb}`}
    else{const up=yb<ya;const y1=ya+(up?-BH/2:BH/2),y2=yb+(up?BH/2+2:-BH/2-2);d=`M${xa+8} ${y1} C ${xa+8} ${(y1+y2)/2}, ${xb+8} ${(y1+y2)/2}, ${xb+8} ${y2}`}

  if(MAPV.vue==="semaine"){
    D.pivots.forEach(n=>{(n.declencheurs||[]).forEach(dc=>{const u=pdate(dc.date);if(u==null||u<sc.s||u>sc.e)return;const x=sc.x(u),y=yc(n.id)+9;
      s+=`<path d="M${x} ${y-5} l5 5 l-5 5 l-5 -5z" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.3"><title>${esc(dc.texte)} (${esc(dc.date)}) · vers : ${esc(dc.vers)}</title></path>`})});
    D.actualite.forEach(e=>{const t=e.traitement||{};const id=t.noeud||(e.effets.find(f=>f.cible.startsWith("PV"))||{}).cible;if(!id)return;const u=dU(e.date);if(u<sc.s||u>sc.e)return;

function tmapList(pi){const t0=todayU();

function forecasts(){const out=[];
  D.pivots.forEach(n=>out.push({id:n.id,piv:n.id,texte:n.question,dist:n.issues.map((o,i)=>[o.nom,M.marg[n.id][i]]),rg:M.rng[n.id],echeance:n.echeance}));
  const qb=N("PV-02").autresQuestions[0];const d=to100(qb.hypotheses.map(h=>median(h.estimations)));
  out.push({id:qb.id,piv:"PV-02",texte:qb.texte,dist:qb.hypotheses.map((h,i)=>[h.nom,d[i]]),rg:qb.hypotheses.map(h=>[Math.min(...h.estimations),Math.max(...h.estimations)]),echeance:"2027-04-18",ext:qb.hypotheses.map(h=>h.externe)});
  D.previsionsSimples.forEach(p=>{const m=median(p.estimations);out.push({id:p.id,ind:p.ind,texte:p.texte,dist:[["Oui",m],["Non",100-m]],rg:[[Math.min(...p.estimations),Math.max(...p.estimations)],[100-Math.max(...p.estimations),100-Math.min(...p.estimations)]],echeance:p.echeance})});
  return out.sort((a,b)=>a.echeance.localeCompare(b.echeance))}

/* --- vues --- */

  const pre=Object.entries(M.sens).filter(([k])=>N(k.split(">")[1]).periode<4).sort((a,b)=>b[1]-a[1])[0];const [pa,pc]=pre[0].split(">");

    `Il l'emporte presque autant après un budget 2027 adopté (${fr(sc.viaA,0)} points) qu'après un échec (${fr(sc.viaX,0)} points). Avant l'élection, le lien le plus influent relie ${esc(N(pa).nom.toLowerCase())} et ${esc(N(pc).nom.toLowerCase())} (±${pre[1]} points). Huit moments pivots sont ${T("calcule","calculés")} ensemble.`)

}

function carte(){const edges=[];D.pivots.forEach(n=>n.parents.forEach(p=>edges.push([p.id,n.id,M.sens[p.id+">"+n.id]])));edges.sort((a,b)=>b[2]-a[2]);
  return head("Carte","Les moments pivots sur l'axe du temps, d'octobre 2026 à septembre 2028. Choisissez une issue pour voir le chemin qui y mène.")
  +mapBlock(true)
  +sec("Liens les plus influents",`<div class="tw"><table class="resp"><thead><tr><th>Pivot amont</th><th>Pivot aval</th><th>${T("sensibilite","Écart d'influence")}</th></tr></thead><tbody>${edges.map(([a,b,v])=>`<tr><td class="lead">${link(a)}</td><td data-l="Pivot aval">${link(b)}</td><td data-l="Écart"><span class="${v>=CRIT?"b":""}" style="${v>=CRIT?"color:var(--accent)":""}">±${v} pts</span></td></tr>`).join("")}</tbody></table></div>`)
  +`<details class="more" style="margin-top:16px"><summary>Comment la carte est calculée</summary><div class="in sm"><p style="margin:0">Chaque pivot est placé à son échéance. Les liens relient un pivot à ceux dont il change les probabilités. Le chemin le plus probable est la combinaison d'issues la plus probable sur l'ensemble du réseau.</p><p style="margin:0">Le chemin vers une issue choisie est calculé à rebours : on suppose l'issue réalisée, et le réseau recalcule ce qui devient le plus probable en amont et en aval. Rien n'est estimé de nouveau, et aucune prévision du registre ne change.</p><p style="margin:0">La vue semaine montre les onze semaines autour d'aujourd'hui : échéances, déclencheurs datés et faits relevés.</p></div></details>`}

function indicateurs(){return head("Indicateurs structurels",`Les grandes forces lentes qui conditionnent la stabilité, chacune résumée par une ${T("note","note sur 10")}.`)
  +`<div class="grid2">${D.indicateurs.map(indBox).join("")}</div>`
  +sec("À construire",`<div class="rowx">${D.indicateursProposes.map(n=>`<span class="tag n">${esc(n)}</span>`).join("")}</div><p class="sm muted" style="margin:12px 0 0">Huit indicateurs seront retenus au total parmi ces propositions.</p>`)}

function lineChart(si){const pts=si.serie,W=520,H=240,L=44,R=14,T0=16,B=34,xs=pts.map(p=>p[0]),x0=Math.min(...xs),x1=Math.max(...xs),y0=60,y1=130;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T0+(1-(y-y0)/(y1-y0))*(H-T0-B);const fs='font-size="14" fill="var(--muted)" font-family="Public Sans, sans-serif"';
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dette publique en pourcentage du PIB, 2007-2026"><rect x="${L}" y="${Y(130)}" width="${W-L-R}" height="${Y(120)-Y(130)}" fill="var(--crit-soft)"/><rect x="${L}" y="${Y(120)}" width="${W-L-R}" height="${Y(100)-Y(120)}" fill="var(--warn-soft)"/>`;
  [60,80,100,120].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+5}" text-anchor="end" ${fs}>${v}</text>`});
  [2008,2014,2020,2026].forEach(v=>{s+=`<text x="${X(Math.min(v,x1))}" y="${H-10}" text-anchor="${v===2026?"end":"middle"}" ${fs}>${v}</text>`});
  s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.4" points="${pts.map(p=>X(p[0])+","+Y(p[1])).join(" ")}"/>`;const l=pts.at(-1);
  s+=`<circle cx="${X(l[0])}" cy="${Y(l[1])}" r="4.5" fill="var(--accent)"/><text x="${X(l[0])-10}" y="${Y(l[1])+20}" text-anchor="end" font-size="15" font-weight="700" fill="var(--ink)" font-family="Public Sans, sans-serif">${fr(l[1])} %</text></svg>`;
  return s+`<div class="legend nog"><span><i style="width:12px;height:10px;background:var(--warn-soft)"></i>sous tension</span><span><i style="width:12px;height:10px;background:var(--crit-soft)"></i>critique</span></div>`}
function spreadChart(si){const pts=si.points,W=520,H=210,L=44,R=14,T0=14,B=32,y0=60,y1=160;const X=i=>L+i/(pts.length-1)*(W-L-R),Y=y=>T0+(1-(y-y0)/(y1-y0))*(H-T0-B);const fs='font-size="14" fill="var(--muted)" font-family="Public Sans, sans-serif"';
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Écart OAT-Bund, septembre 2026"><rect x="${L}" y="${Y(160)}" width="${W-L-R}" height="${Y(100)-Y(160)}" fill="var(--crit-soft)"/>`;
  [60,100,150].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===150?"var(--warn)":"var(--line)"}" ${v===150?'stroke-dasharray="5 4"':""}/><text x="${L-8}" y="${Y(v)+5}" text-anchor="end" ${fs}>${v}</text>`});
  pts.forEach((p,i)=>{if(i%2===0||i===pts.length-1)s+=`<text x="${X(i)}" y="${H-8}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}" ${fs}>${p[0]}</text>`});
  s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.4" points="${pts.map((p,i)=>X(i)+","+Y(p[1])).join(" ")}"/>`;const l=pts.length-1;
  s+=`<circle cx="${X(l)}" cy="${Y(pts[l][1])}" r="4.5" fill="var(--accent)"/><text x="${X(l)-10}" y="${Y(pts[l][1])+22}" text-anchor="end" font-size="15" font-weight="700" fill="var(--ink)" font-family="Public Sans, sans-serif">${pts[l][1]} pb</text></svg>`;
  return s+`<div class="legend nog"><span><i style="width:12px;height:10px;background:var(--crit-soft)"></i>critique</span><span><i style="width:14px;border-top:2px dashed var(--warn)"></i>150 pb, seuil de la prévision P-005</span></div>`}

function indPage(id){const ind=D.indicateurs.find(i=>i.id===id);if(!ind)return indicateurs();const n=noteInd(ind);const [c,l]=etat(n);
  const evs=D.actualite.filter(e=>e.effets.some(f=>f.cible===id||ind.sous.includes(f.cible)));const prev=D.previsionsSimples.filter(p=>p.ind===id);

  +`<div class="box"><div class="rowx sp"><div class="rowx"><span class="big">${fr(n)}</span><span class="muted">${T("note","sur 10")}</span>${trend(ind.tendance)}</div><span class="tag ${c}">${l}</span></div>${gauge(n)}
   <p style="margin:0">${esc(ind.lecture)}</p><div class="sm muted">Pèse sur ${ind.pivots.map(p=>link(p)).join(", ")}${prev.length?" et la prévision "+prev.map(p=>`<button class="lnk" data-go="previsions" data-hl="${p.id}">${p.id}</button>`).join(", "):""}.</div></div>`
  +sec("Sous-indicateurs",`<div>${ind.sous.map(siById).map(s=>{const sc=score(s);const [cc,ll]=etat(sc);return `<details class="block"><summary><span style="min-width:0;flex:1"><span class="rowx sp"><span>${esc(s.nom)}</span><span>${esc(s.affiche)}</span></span><span class="rowx sp" style="font-weight:400;margin-top:4px"><span class="sm muted">${esc(marge(s))}</span><span class="tag ${cc}">${ll}</span></span></span></summary>
     <div class="in"><div class="gauge" role="img" aria-label="note ${fr(sc)} sur 10"><i style="left:${sc*10}%"></i></div>
     <div><div class="b sm">Comment il agit</div><p class="sm" style="margin:2px 0 0">${esc(s.action)}</p></div>
     <div><div class="b sm">Pourquoi ces seuils : ${esc(seuilsTxt(s))}</div><p class="sm" style="margin:2px 0 0">${esc(s.pourquoi)}</p></div>
     <div class="sm muted">${esc(s.date)} · précédent : ${esc(s.precedent)} · <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.source)}</a> · ${T("confiance","confiance")} ${esc(s.confiance)}</div></div></details>`}).join("")}</div>`)
  +`<div class="grid2">${sec("Dette publique, % du PIB",`<div class="chart">${lineChart(siById("SI-01-01"))}</div>`)}${sec("Écart OAT-Bund, en pb",`<div class="chart">${spreadChart(siById("SI-01-04"))}</div>`)}</div>`
  +sec("Actualité liée",`<div class="rows">${evs.map(e=>`<div class="rowlink" tabindex="0" role="link" data-go="actualite"><div class="sm muted">${dfr(e.date)}</div><div>${esc(e.titre)}</div></div>`).join("")}</div>`)}

function sousInd(){return head("Sous-indicateurs","Les mesures qui alimentent les indicateurs structurels.")
  +D.indicateurs.map(ind=>sec(esc(ind.nom),`<div class="tw"><table class="resp"><thead><tr><th>Mesure</th><th>Valeur</th><th>État</th><th>Marge</th><th>Date</th><th>Source</th></tr></thead><tbody>
  ${ind.sous.map(siById).map(s=>{const [c,l]=etat(score(s));return `<tr><td class="lead">${esc(s.nom)}</td><td data-l="Valeur" style="white-space:nowrap">${esc(s.affiche)}</td><td data-l="État"><span class="tag ${c}">${l}</span></td><td data-l="Marge">${esc(marge(s))}</td><td data-l="Date">${esc(s.date)}</td><td data-l="Source"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.source)}</a></td></tr>`}).join("")}</tbody></table></div>`,link(ind.id,"Ouvrir la fiche"))).join("")}

function pivots(){return head("Moments pivots","Les moments dont l'issue n'est pas écrite, rangés dans l'ordre où ils se dénouent.")
  +D.periodes.map((ph,k)=>{const ns=D.pivots.filter(n=>n.periode===k);if(!ns.length)return "";return `<section class="sec ${k===4?"zonesec":""}"><div class="sh"><h2>${esc(ph)}</h2>${k===4?`<span class="tag z">${T("projection","projection")}</span>`:""}</div><div class="grid2" style="gap:16px 24px">${ns.map(n=>{const dm=dom(n.id);
    return `<div class="box go" tabindex="0" role="link" data-go="pivot-${n.id}"><div class="rowx sp"><h3>${esc(n.nom)}</h3>${typeTag(n)}</div><div class="sm muted">${esc(n.question)}</div><div class="rowx"><span class="big">${P(dm.p)}</span><span><span class="b">${esc(dm.o.nom)}</span><br><span class="sm muted">${T("fourchette","fourchette")} ${dm.r[0]}–${dm.r[1]}</span></span></div>${n.parents.length?`<div class="sm muted">Dépend de ${n.parents.map(p=>esc(N(p.id).nom)).join(", ")}</div>`:""}</div>`}).join("")}</div></section>`}).join("")
  +sec("À venir",`<div class="rowx"><span class="tag n">Gaza</span><span class="tag n">Iran et détroit d'Ormuz</span><span class="tag n">Climat</span></div><p class="sm muted" style="margin:12px 0 0">Les pivots de crise s'ouvriront sur la réalité humaine avant toute probabilité.</p>`)}

function pivotPage(id){const n=N(id);if(!n)return pivots();
  const children=D.pivots.filter(c=>c.parents.some(p=>p.id===id));
  const ext=null;
  let qs=`<div class="box"><h3>${esc(n.question)}</h3>${bars(n.issues,M.marg[id],M.rng[id],ext)}${barKey(false)}`;
  if(n.parents.length){const rows=condTable(n);qs+=`<details class="more"><summary>Selon les pivots amont</summary><div class="in"><div class="tw"><table><thead><tr><th>Si…</th>${n.issues.map(o=>`<th>${esc(o.court)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.lab)}</td>${r.v.map(v=>`<td>${P(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div></details>`}
  qs+=`<div class="sm muted">Résolution : ${esc(n.resolution)} ${regLink(id)}</div></div>`;
  (n.autresQuestions||[]).forEach(q=>{const d=to100(q.hypotheses.map(h=>median(h.estimations)));const ex=q.hypotheses.map(h=>h.externe);
    qs+=`<div style="height:16px"></div><div class="box"><h3>${esc(q.texte)}</h3>${bars(q.hypotheses,d,q.hypotheses.map(h=>[Math.min(...h.estimations),Math.max(...h.estimations)]),ex)}${barKey(true)}<p class="sm" style="margin:0;color:var(--warn)">Écart marqué avec le modèle Sondax sur le duel RN contre LFI. <a href="${esc(q.externeUrl)}" target="_blank" rel="noopener">Source</a></p><div class="sm muted">Résolution : ${esc(q.resolution)} ${regLink(q.id)}</div></div>`});
  const evs=D.actualite.filter(e=>(n.actualite||[]).includes(e.id));
  const est=[0,1,2].map(k=>{const v=to100(n.issues.map(o=>prob(M.Je[k],a=>a[id]===o.id)*100));return `<div><div class="rowx sp"><span class="b sm">${esc(D.meta.estimateurs[k])}</span><span class="sm">${n.issues.map((o,j)=>`${esc(o.court)} ${P(v[j])}`).join(" · ")}</span></div>${n.raisons?`<p class="sm muted" style="margin:4px 0 0">${esc(n.raisons[k])}</p>`:""}</div>`}).join("");
  return head(esc(n.nom),esc(n.phrase),`<button class="lnk" data-go="pivots">Moments pivots</button> / ${esc(n.nom)}`)
  +`<div class="rowx" style="margin:-12px 0 8px">${typeTag(n)}<span class="sm muted">Échéance ${dfr(n.echeance)}</span>${n.parents.length?`<span class="sm muted">Dépend de ${n.parents.map(p=>link(p.id)).join(", ")}</span>`:""}${children.length?`<span class="sm muted">Pèse sur ${children.map(c=>link(c.id)).join(", ")}</span>`:""}</div>`
  +(n.realiteHumaine?sec("Réalité humaine",`<p style="margin:0">${esc(n.realiteHumaine)}</p>`):"")
  +sec("Probabilités",qs)
  +sec("Analyse",`<details class="block" open><summary>Ce qui ferait basculer</summary><div class="in">${(n.declencheurs||[]).map(x=>`<div class="rowx sp"><div style="min-width:0;flex:1 1 240px">${esc(x.texte)}<div class="sm muted">vers : ${esc(x.vers)}</div></div><span class="tag n">${esc(x.date||x.distance)}</span></div>`).join("")}</div></details>
   <details class="block"><summary>Raisonnement</summary><div class="in"><div class="b sm">${T("taux de base","Taux de base")}</div><ul class="sm" style="margin:0;padding-left:18px">${(n.tauxDeBase||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
     ${n.conversion?`<div class="b sm" style="margin-top:6px">Ajustements</div><div class="rows sm">${n.conversion.map(c=>`<div><div class="b">${esc(c.facteur)}</div><div class="muted">${esc(c.effet)}</div></div>`).join("")}</div>`:""}${n.noteChemin?`<p class="sm muted" style="margin:0">${esc(n.noteChemin)}</p>`:""}</div></details>
   <details class="block"><summary>Les trois estimations</summary><div class="in rows">${est}</div></details>
   ${children.length||n.projections?`<details class="block"><summary>Conséquences</summary><div class="in">${children.map(c=>`<div class="sm">Pèse sur ${link(c.id)} : ${T("sensibilite","écart d'influence")} de ±${M.sens[id+">"+c.id]} points.</div>`).join("")}${(n.projections||[]).map(x=>{const h=n.issues.find(h=>h.id===x.hyp);return `<div class="sm"><span class="b">${esc(h?h.nom:x.hyp)}</span> · ${esc(x.texte)}</div>`}).join("")}</div></details>`:""}
   ${evs.length?`<details class="block"><summary>Actualité liée</summary><div class="in">${evs.map(e=>`<div class="rowlink sm" tabindex="0" role="link" data-go="actualite"><span class="muted">${dfr(e.date)}</span> · ${esc(e.titre)}</div>`).join("")}</div></details>`:""}`)}

const CAS={a:["Sans effet","n"],b:["Donnée","ok"],c:["Évidence","a"],d:["Paramètre","warn"],e:["Hors modèle","n"],f:["En observation","n"]};
const casTag=k=>{const c=CAS[k]||["Non trié","n"];return `<span class="tag ${c[1]}"><span class="term" tabindex="0" data-def="cas-${k}">${c[0]}</span></span>`};
const iss=(t,o)=>N(t).issues.find(x=>x.id===o);
const pv=(m,t,o)=>Math.round(m[t][N(t).issues.findIndex(x=>x.id===o)]);
const sgn=d=>d?` <span class="sm muted">(${d>0?"+":"−"}${Math.abs(d)})</span>`:"";
function actualite(){const F=fil(),L=MAJ(),S=SUIVIS();
  const lbl=([t,o])=>`${N(t).court} · ${iss(t,o).court}`;
  const filT=`<div class="tw"><table class="resp"><thead><tr><th>Date</th><th>Fait</th>${S.map(x=>`<th>${esc(lbl(x))}</th>`).join("")}</tr></thead><tbody>${F.map((p,i)=>`<tr><td class="lead" style="white-space:nowrap">${dfr(p.u?p.u.date:D.meta.releve)}</td><td data-l="Fait">${p.u?`${casTag(p.u.cas)} ${esc(p.u.resume)}`:"Estimation initiale"}</td>${S.map(x=>`<td data-l="${esc(lbl(x))}"><span class="b">${pv(p.m,...x)} %</span>${i?sgn(pv(p.m,...x)-pv(F[i-1].m,...x)):""}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  ${L.length?"":`<p class="sm muted" style="margin:8px 0 0">Aucune mise à jour depuis l'estimation initiale : les faits ci-dessous étaient connus lorsqu'elle a été produite.</p>`}`;
  const card=e=>{const t=e.traitement||{};const us=L.filter(u=>u.ev===e.id);const ann=(D.majs||[]).filter(u=>u.ev===e.id&&u.statut==="annulée");
    const nodes=[...new Set([t.noeud,...e.effets.map(f=>f.cible)].filter(x=>x&&x.startsWith("PV")))];
    const maj=us.map(u=>{const i=L.indexOf(u),A=F[i].m,B=F[i+1].m,n=N(u.noeud);let j=B[u.noeud].indexOf(Math.max(...B[u.noeud]));if(u.lr){const k=Object.entries(u.lr).sort((x,y)=>y[1]-x[1])[0][0];j=n.issues.findIndex(x=>x.id===k)}if(u.cas==="b")j=n.issues.findIndex(x=>x.id===u.issue);const o=n.issues[j].id;
      const ch=S.filter(([x])=>x!==u.noeud).map(x=>{const d=pv(B,...x)-pv(A,...x);return d?`${esc(lbl(x))} ${pv(A,...x)} → ${pv(B,...x)} %`:""}).filter(Boolean);
      return `<div class="sm"><span class="b">Mise à jour du ${dfr(u.date)}</span> · ${esc(n.court)} ${esc(n.issues[j].court)} : <span class="b">${pv(A,u.noeud,o)} % → ${pv(B,u.noeud,o)} %</span>${u.lr?` (${T("rv","rapport de vraisemblance")} ${String(u.lr[o]||1).replace(".",",")})`:""}</div>
      <div class="sm">${ch.length?"Effet propagé : "+ch.join(" · "):"Aucun effet propagé d'au moins un point sur les pivots suivis."}</div>
      ${u.estimations?`<details class="block"><summary>Les ${u.estimations.length} évaluations</summary><div class="in rows">${u.estimations.map(x=>`<div class="sm"><span class="b">${esc(x.eval)} · ${T("rv","R")} = ${String(x.R).replace(".",",")}</span><div>${esc(x.texte)}</div><div class="muted">${T("taux de base","Classe de référence")} : ${esc(x.classe)}</div></div>`).join("")}</div></details>`:""}`}).join("");
    const por=(t.portee||nodes).map(id=>{const n=N(id),r=portee(id,M.Jm);return r.length?`<div class="tw"><table class="sm" style="width:auto;min-width:0"><thead><tr><th>Si ${esc(n.court)} :</th>${n.issues.map(x=>`<th style="text-align:right">${esc(x.court)}</th>`).join("")}</tr></thead><tbody>${r.map(q=>`<tr><td>${esc(lbl([q.t,q.o]))}</td>${q.v.map(v=>`<td style="text-align:right">${v} %</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:`<div class="sm"><span class="b">${esc(n.court)}</span> : aucun pivot suivi en aval.</div>`}).join("");
    return `<article style="display:flex;flex-direction:column;gap:6px"><div class="sm muted">${dfr(e.date)}</div><h3>${esc(e.titre)}</h3><p style="margin:0">${esc(e.resume)}</p>
    <div class="rowx">${casTag(t.cas)}${t.integre?`<span class="tag n">Intégré à l'estimation initiale</span>`:""}${e.effets.filter(f=>f.cible!=="IS-futur").map(f=>`<button class="tag a" style="border:0;cursor:pointer;white-space:normal;text-align:left" data-go="${route(f.cible)}">${esc(lab(f.cible))}</button>`).join("")}</div>
    ${t.motif?`<p class="sm" style="margin:0">${esc(t.motif)}</p>`:""}${t.reexamen?`<div class="sm muted">Réexamen le ${dfr(t.reexamen)}</div>`:""}${maj}${ann.map(u=>`<div class="sm muted">${esc(u.id)} annulée le ${dfr(u.annulation.date)}.</div>`).join("")}
    ${por?`<details class="block"><summary>${T("portee","Portée dans le modèle")}</summary><div class="in">${por}</div></details>`:""}
    <div class="sm muted"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.source)}</a> · ${T("confiance","confiance")} ${esc(e.confiance)}</div></article>`};
  const evs=D.actualite.slice().sort((x,y)=>y.date.localeCompare(x.date));
  return head("Actualité","Ce que chaque fait change, ou ne change pas, dans le modèle.")
  +sec("Fil des probabilités",filT)
  +(D.tris&&D.tris.length?sec("Dernier tri",(t=>`<p style="margin:0 0 8px">${dfr(t.date)} · ${t.titres} titres relevés (${esc(t.periode)}) · <span class="b">${t.retenus.length} fait${t.retenus.length>1?"s":""} retenu${t.retenus.length>1?"s":""}</span>, regroupant ${t.retenus_titres} titres.</p><details class="block"><summary>Titres écartés et motifs</summary><div class="in rows">${t.ecartes.map(x=>`<div class="sm"><span class="b">${esc(x.sujet)}</span> · ${x.n} titres<div class="muted">${esc(x.motif)}</div></div>`).join("")}</div></details>`)(D.tris[D.tris.length-1])):"")
  +sec("Faits triés",`<div class="legend nog" style="margin-bottom:10px">${Object.keys(CAS).map(casTag).join("")}</div><div class="rows">${evs.map(card).join("")}</div>`)}

function previsions(){const fc=forecasts();return head("Prévisions",`Le ${T("fige","registre figé")} de toutes les prévisions, et leur résultat à échéance.`)
  +`<div class="tw"><table class="resp"><thead><tr><th>Question</th><th>Probabilités</th><th>Échéance</th><th>${T("externe","Référence")}</th><th>Résultat</th></tr></thead><tbody>
  ${fc.map(f=>`<tr id="row-${f.id}"><td class="lead" style="min-width:220px">${esc(f.texte)}<div class="sm muted" style="font-weight:400">${f.id} · ${f.piv?link(f.piv):link(f.ind)} · émise le ${dfr(D.meta.releve)}</div></td>
  <td class="blk" data-l="Probabilités" style="min-width:180px">${f.dist.map(([n,v],i)=>`<div class="rowx sp" style="flex-wrap:nowrap"><span>${esc(n)}</span><span style="white-space:nowrap"><span class="b">${P(v)}</span> <span class="muted sm">${f.rg[i][0]}–${f.rg[i][1]}</span></span></div>`).join("")}</td>
  <td data-l="Échéance">${dfr(f.echeance)}</td><td data-l="Référence">${f.ext?f.dist.map((d,i)=>f.ext[i]!=null?`${esc(d[0])} ${P(f.ext[i])}`:"").filter(Boolean).join("<br>"):"—"}</td><td data-l="Résultat"><span class="tag n">En attente</span></td></tr>`).join("")}
  ${D.revisees.map(r=>`<tr class="old"><td class="lead" style="min-width:220px">${esc(r.texte)}<div class="sm muted" style="font-weight:400">${r.id} · émise le ${dfr(r.emise)} · ${esc(r.motif)}</div></td><td class="blk" data-l="Probabilités">${r.dist.map(([n,v])=>`<div class="rowx sp" style="flex-wrap:nowrap"><span>${esc(n)}</span><s>${P(v)}</s></div>`).join("")}</td><td data-l="Échéance">—</td><td data-l="Référence">—</td><td data-l="Résultat"><span class="tag n">Révisée</span></td></tr>`).join("")}
  </tbody></table></div>`}

function precedents(){return head("Précédents historiques",`Les cas passés qui fournissent les ${T("taux de base","taux de base")}.`)
  +`<div class="rows">${D.precedents.map(p=>`<article style="display:flex;flex-direction:column;gap:4px"><div class="rowx sp"><h3>${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.cas)}</a>`:esc(p.cas)}</h3><span class="tag n">${esc(p.type)}</span></div><p class="sm" style="margin:0">${esc(p.contexte)}. <span class="b">Issue :</span> ${esc(p.issue)}${p.duree?` (${esc(p.duree)})`:""}.</p></article>`).join("")}</div>`}

function collecte(){if(!C)return `<p class="empty">La collecte automatique n'a pas encore produit de données.</p>`;
  return `<div class="tw"><table class="resp"><thead><tr><th>Série</th><th>Dernière valeur</th><th>État</th></tr></thead><tbody>${Object.values(C.series).map(s=>{const d=s.donnees&&s.donnees.length?s.donnees.at(-1):null;
  const v=Array.isArray(d)?`${esc(d[0])} : <span class="b">${typeof d[1]==="number"?fr(d[1],d[1]%1?1:0):esc(d[1])}</span>`:Array.isArray(s.donnees)?`${s.donnees.length} marchés`:"—";
  return `<tr><td class="lead">${esc(s.nom)}<div class="sm muted" style="font-weight:400">${esc(s.source)}</div></td><td data-l="Valeur">${v}</td><td data-l="État"><span class="tag ${s.statut==="ok"?"ok":"crit"}">${s.statut==="ok"?"À jour":"Échec"}</span></td></tr>`}).join("")}</tbody></table></div><p class="sm muted" style="margin:10px 0 0">Dernière exécution le ${esc(C.execution.slice(0,10).split("-").reverse().join("/"))} à ${esc(C.execution.slice(11,16))} UTC.</p>`}

function methodologie(){return head("Méthode et glossaire","Les règles qui encadrent les prévisions et le vocabulaire de l'outil.")
  +sec("Règles",`<ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px">
  <li>Toute prévision est une question fermée, datée, avec un critère de résolution écrit dès l'émission.</li>
  <li>Chaque estimation part du ${T("taux de base","taux de base")} et de l'hypothèse « rien ne change » ; chaque ajustement est écrit.</li>
  <li>Chaque probabilité conditionnelle est la ${T("mediane","médiane de trois")} estimations indépendantes ; les probabilités globales et les scénarios sont calculés sur tout le réseau.</li>
  <li>Un pivot a au plus trois pivots amont ; un facteur n'agit que par un seul chemin, pour ne jamais être compté deux fois.</li>
  <li>Un indicateur repéré après coup n'est validé que sur des événements futurs.</li>
  <li>Le relevé hebdomadaire applique les règles ; seule l'analyse trimestrielle peut les modifier, avec une trace au journal.</li>
  <li>Les projections s'arrêtent à deux ans ; au-delà, l'outil ne produit pas de prévision notée.</li></ol>`)
  +sec("Journal des révisions",`<div class="rows">${D.journal.map(j=>`<div><div class="rowx"><span class="sm muted">${dfr(j.date)}</span><span class="tag n">${esc(j.type)}</span></div><p class="sm" style="margin:6px 0 0">${esc(j.texte)}</p></div>`).join("")}</div>`)
  +sec("Collecte automatique",collecte())
  +sec("Glossaire",`<dl class="dict nog">${Object.values(G).sort((a,b)=>a[0].localeCompare(b[0],"fr")).map(([t,d])=>`<dt>${esc(t)}</dt><dd class="sm just">${esc(d)}</dd>`).join("")}</dl>`)}

/* --- démarrage --- */
fetch("data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{D=j;build();render();
  fetch("data/collecte.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(c=>{if(c){C=c;if(location.hash.includes("methodologie"))render()}}).catch(()=>{})})
  .catch(e=>{console.error(e);$("#view").innerHTML=`<p class="empty">Les données n'ont pas pu être chargées. Rechargez la page.</p>`});
</script>

</body>
</html>
